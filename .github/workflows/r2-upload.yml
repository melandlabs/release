name: Upload Release Artifacts to R2

# Publishes CI-built artifacts to the alloomi R2 bucket with release-style
# filenames. Modeled on .github/workflows/release-artifacts.yml from the
# release branch, but uploads to R2 via the S3 API instead of creating a
# GitHub Release. Manual only.
#
# Flavors (keep them strictly apart):
# - standard: the regular build. Publishes the full 5-file set and is the
#   only variant allowed to move latest.json / release.json.
# - outlook-china: customer variant built with enable_outlook_china=true.
#   Its artifact set is typically PARTIAL (e.g. only macOS aarch64 + windows)
#   and its runs are never the "latest successful ci.yml run", so a source
#   run ID is mandatory. It never updates the manifest: release.json is
#   shared with standard clients (see get_platform_download_filename in
#   alloomi apps/web/src-tauri/src/update.rs) and pointing it at a version
#   whose Alloomi_* files don't exist yet would break standard auto-updates.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Source CI run ID. Required for outlook-china (the run dispatched with enable_outlook_china=true); optional for standard (defaults to the latest successful ci.yml run)'
        required: false
        type: string
      version:
        description: 'Version to publish, e.g. 0.6.7 (optional, defaults to the version stamped inside the artifacts)'
        required: false
        type: string
      variant:
        description: 'Which CI artifact variant to publish'
        required: true
        type: choice
        options:
          - standard
          - outlook-china
        default: standard
      update_latest:
        description: 'Point latest.json and release.json at this version after the upload. Only applies to the standard variant; outlook-china publishes always skip it.'
        required: true
        type: boolean
        default: true

env:
  R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # Filename convention must match alloomi's updater (apps/web/src-tauri/src/
  # update.rs get_platform_download_filename): macOS aarch64, linux aarch64,
  # windows amd64. Even though tauri's own deb is named *_arm64.deb, the
  # published name has to be *_linux_aarch64.deb or arm64 clients 404 on R2.

jobs:
  upload-to-r2:
    runs-on: ubuntu-22.04
    permissions:
      # actions: read → list and download the artifacts of the source run.
      # contents: read → the artifacts API calls made with GITHUB_TOKEN.
      actions: read
      contents: read
    steps:
      - name: Resolve run ID and naming
        id: names
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = "outlook-china" ]; then
            # bucket files use the Alloomi_outlook_china_ prefix (see the
            # 0.6.5+ entries). These runs only exist when someone dispatched
            # ci.yml with enable_outlook_china=true, and the "latest
            # successful run" heuristic can never find them — the run ID has
            # to be supplied explicitly.
            if [ "${{ github.event.inputs.source_run_id }}" = "" ]; then
              echo "ERROR: variant=outlook-china requires source_run_id (the CI run dispatched with enable_outlook_china=true)."
              exit 1
            fi
            echo "name_prefix=Alloomi_outlook_china_" >> $GITHUB_OUTPUT
          else
            echo "name_prefix=Alloomi_" >> $GITHUB_OUTPUT
          fi

      - name: Find latest CI run
        if: github.event.inputs.source_run_id == ''
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=ci.yml --status=success --repo=${{ github.repository }} --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Resolve source run ID
        id: source
        run: |
          echo "run_id=${{ github.event.inputs.source_run_id || steps.find-run.outputs.run_id }}" >> $GITHUB_OUTPUT

      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          RUN_ID="${{ steps.source.outputs.run_id }}"

          # The CI artifacts are uploaded with `archive: false` (see the
          # "Upload CI ..." steps in ci.yml): GitHub stores the build output
          # as-is and serves it raw, with no zip wrapped around it.
          # `gh run download` cannot read those -- it unzips whatever the
          # artifacts API returns and fails with "not a valid zip file" on
          # a raw file. The artifacts API answers with a redirect to the
          # blob storage URL of the file itself, so follow that redirect.
          #
          # No -e: a failed download must not abort the loop, the missing
          # files are tallied in the rename step below.
          COUNT=0
          while IFS=$'\t' read -r id name; do
            [ -n "$name" ] || continue
            echo "downloading artifact $name (id $id)"
            mkdir -p "dl/$name"
            if ! curl -fsSL \
                 -H "Authorization: token $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
                 -o "dl/$name/$name"; then
              echo "WARN: artifact $name could not be downloaded"
              continue
            fi
            COUNT=$((COUNT+1))
          done <<< "$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[] | [.id, .name] | @tsv')"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: no artifacts downloaded from run $RUN_ID. Is it a ${{ inputs.variant }} run?"
            exit 1
          fi
          echo "downloaded $COUNT artifact(s):"
          find dl -type f | sed 's/^/  /'

      - name: Rename artifacts to release filenames
        id: meta
        run: |
          set -euo pipefail
          PREFIX="${{ steps.names.outputs.name_prefix }}"

          # Derive the version from whatever artifact is available: tauri
          # names files alloomi_<version>_{amd64,arm64}.deb and
          # alloomi_<version>_x64-setup.exe (stable 0.6.7 or nightly
          # 0.6.8-nightly.20261010). The DMGs are renamed to
          # Alloomi_ci_<commit-sha>_{aarch64,x64}.dmg and carry no version,
          # so they are only the last resort. outlook-china sets are
          # partial, so the linux amd64 deb is not guaranteed.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            ANY=$(find dl -type f \( -name '*.deb' -o -name '*.exe' \) | head -n1 || true)
            [ -n "$ANY" ] || ANY=$(find dl -type f -name '*.dmg' | head -n1 || true)
            BASE=$(basename "$ANY")
            BASE="${BASE#alloomi_}"; BASE="${BASE#Alloomi_}"
            VERSION=$(echo "$BASE" | sed -E 's/\.(deb|dmg|exe)$//; s/_(amd64|arm64|aarch64|x64)(-setup)?$//')
          fi
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not derive a version; pass the version input explicitly."
            exit 1
          fi
          case "$VERSION" in
            ci_*)
              # Only the DMGs are there, and their file names carry a commit
              # sha rather than a version.
              echo "ERROR: no version in the artifact file names; pass the version input explicitly."
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing ${{ inputs.variant }} version: $VERSION"

          mkdir -p artifacts
          # <file name glob> <published name>. The artifacts are raw files
          # named after the build output, so the platform is identified by
          # the arch suffix of the file name.
          rename() {
            local src
            # || true: with pipefail, find on a dir this run didn't produce
            # would otherwise abort the whole step — missing artifacts are
            # legal for the outlook-china variant.
            src=$(find dl -type f -name "$1" 2>/dev/null | head -n1 || true)
            if [ -z "$src" ]; then
              echo "MISSING: no artifact matching $1"
              return 1
            fi
            mv "$src" "artifacts/$2"
            echo "renamed: $2"
            return 0
          }
          FOUND=0
          MISSING=""
          publish() {
            if rename "$1" "$2"; then
              FOUND=$((FOUND+1))
            else
              MISSING="$MISSING $1"
            fi
          }
          publish '*_aarch64.dmg' "${PREFIX}${VERSION}_macOS_aarch64.dmg"
          publish '*_x64.dmg'     "${PREFIX}${VERSION}_macOS_amd64.dmg"
          publish '*_amd64.deb'   "${PREFIX}${VERSION}_linux_amd64.deb"
          publish '*_arm64.deb'   "${PREFIX}${VERSION}_linux_aarch64.deb"
          publish '*setup.exe'    "${PREFIX}${VERSION}_windows_amd64.exe"
          echo "found $FOUND artifact(s); missing:$MISSING"

          if [ "${{ inputs.variant }}" = "standard" ] && [ "$FOUND" -ne 5 ]; then
            echo "ERROR: standard publishes require the full 5-artifact set; missing:$MISSING"
            exit 1
          fi
          if [ "$FOUND" -lt 1 ]; then
            echo "ERROR: nothing to publish"
            exit 1
          fi
          ls -la artifacts/

      - name: Verify artifacts
        run: |
          set -euo pipefail
          PREFIX="${{ steps.names.outputs.name_prefix }}"
          VERSION="${{ steps.meta.outputs.version }}"
          COUNT=$(ls artifacts | wc -l)
          if [ "${{ inputs.variant }}" = "standard" ] && [ "$COUNT" != "5" ]; then
            echo "ERROR: expected 5 artifacts, found $COUNT"
            exit 1
          fi
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: nothing to publish"
            exit 1
          fi
          # Guard against publishing a build whose embedded version does not
          # match the filename version (same check as the release branch).
          # Only possible when the linux amd64 deb is part of this publish.
          if [ -f "artifacts/${PREFIX}${VERSION}_linux_amd64.deb" ]; then
            DEB_VER=$(dpkg-deb -I "artifacts/${PREFIX}${VERSION}_linux_amd64.deb" | awk '$1 == "Version:" { print $2 }')
            echo "deb control version: $DEB_VER"
            if [ "$DEB_VER" != "$VERSION" ]; then
              echo "ERROR: artifact version mismatch! Expected $VERSION, got $DEB_VER"
              exit 1
            fi
          fi

      - name: Upload artifacts to R2
        working-directory: artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -euo pipefail
          for f in *; do
            aws s3 cp "$f" "s3://${{ vars.R2_BUCKET }}/$f" --endpoint-url "$R2_ENDPOINT" --region auto
          done

      - name: Update latest.json and release.json
        # The manifest is shared with standard clients, so only a standard
        # publish — the full 5-file set — may move the version pointer.
        if: inputs.update_latest && inputs.variant == 'standard'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -euo pipefail
          # Keep the exact 2-space-indent shape already in the bucket.
          printf '{\n  "version": "%s"\n}\n' "${{ steps.meta.outputs.version }}" > latest.json
          cat latest.json
          aws s3 cp latest.json "s3://${{ vars.R2_BUCKET }}/latest.json" --endpoint-url "$R2_ENDPOINT" --region auto
          aws s3 cp latest.json "s3://${{ vars.R2_BUCKET }}/release.json" --endpoint-url "$R2_ENDPOINT" --region auto

      - name: Verify bucket listing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          aws s3 ls "s3://${{ vars.R2_BUCKET }}/" --endpoint-url "$R2_ENDPOINT" --region auto | grep "${{ steps.meta.outputs.version }}"
