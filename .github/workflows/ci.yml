      run: |
        mkdir -p alloomi/.local-dev/gstreamer
        gh release download gstreamer-sdk-1.28.7 \
          --repo melandlabs/release \
          --pattern 'gstreamer-1.0-msvc-x86_64-1.28.7.exe' \
          --dir alloomi/.local-dev/gstreamer

