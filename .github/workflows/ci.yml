      working-directory: ./alloomi/apps/web
      shell: pwsh
      run: |
        # `pnpm tauri:build` reads the regional config picked by ALLOOMI_REGION
        # (default: intl → tauri.conf.intl.json). Patching only tauri.conf.json
        # never reached the active config, so MSI bundling kept running. Loop
        # over every regional config so the patch covers whichever one the
        # build actually loads.
        $paths = @(
          'src-tauri\tauri.conf.json',
          'src-tauri\tauri.conf.intl.json',
          'src-tauri\tauri.conf.cn.json',
          'src-tauri\tauri.conf.dev.json'
        )
        foreach ($path in $paths) {
          $content = Get-Content $path -Raw
          $content = $content -replace '"targets"\s*:\s*"all"', '"targets": ["nsis"]'
          $content = $content -replace '"targets"\s*:\s*\[.*?\]', '"targets": ["nsis"]'
          $content = $content -replace '"wix"\s*:\s*\{[^}]*\}', '"wix": null'
          Set-Content -Path $path -Value $content -NoNewline
