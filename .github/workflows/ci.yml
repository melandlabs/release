      # freedesktop.org truncates and stalls this ~500 MB transfer, and the
      # repo sits at the 10 GB Actions cache limit so the cached copy kept
      # getting evicted, which forced a fresh download on most runs. Pull the
      # pinned archive from a release asset instead: GitHub's CDN is stable
      # and the file no longer competes for the cache budget.
      if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
      shell: bash
      env:
