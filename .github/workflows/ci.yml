name: CI Alloomi (Main Branch)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to build (optional)'
        required: false
        type: string
      enable_outlook_china:
        description: 'Build the Outlook (21Vianet) customer variant: appends NEXT_PUBLIC_ENABLE_OUTLOOK_CHINA=1 to the bundled .env and suffixes every artifact name with -outlook-china'
        required: false
        type: boolean
        default: false
      only_job:
        description: 'Run only this job (job id, e.g. ci-alloomi-macos-arm64). Leave empty to run every job.'
        required: false
        type: string
        default: ''
        # Each job compares this input against its own literal job id.
        # `github.job` is not populated in a job-level `if`, so comparing
        # against it makes every job skip itself -- verified on 2026-10-23
        # with a probe workflow (dispatching only_job=<job id> skipped every
        # job, including the one whose id matched).
  # The same workflow, callable from another workflow, so a caller can run
  # the single macOS arm64 job without dispatching the whole matrix.
  workflow_call:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to build (optional)'
        required: false
        type: string
        default: ''
      enable_outlook_china:
        description: 'Build the Outlook (21Vianet) customer variant'
        required: false
        type: boolean
        default: false
      only_job:
        description: 'Run only this job (job id). Leave empty to run every job.'
        required: false
        type: string
        default: ''

env:
  # CI trigger: bump to re-run on main
  NODE_VERSION: '22.14'
  RUST_VERSION: '1.93'
  ALLOOMI_REPO: 'melandlabs/alloomi'
  ALLOOMI_BRANCH: 'main'

jobs:
  # ─── MacOS arm64 CI ───────────────────────────────────────────────────────────────
  ci-alloomi-macos-arm64:
    # Runs on a self-hosted EC2 Mac (Apple silicon) -- a mac2-m2pro.metal
    # dedicated host, 12 vCPU / 32 GB -- registered with this repo under the
    # `macos-arm64` label.
    #
    # This job used to run on the GitHub-hosted `macos-15` runner: 3 vCPU and
    # 7 GB of RAM, the smallest machine in this workflow, with swapping
    # switched off at the host and no /swapfile to grow. That is what the
    # Turbopack experiment in #33 ran into -- after the route table was done
    # the build went silent for 56 minutes (the same phase takes 5 seconds on
    # the 14 GB Intel runner) because the compile outgrew the RAM and the
    # machine had nowhere to page to. The larger GitHub-hosted runners are not
    # an option: `macos-15-large` / `-xlarge` / `macos-26-xlarge` are not
    # enabled for this org, and a label probe on 2026-10-22 confirmed every
    # one of them fails with "no runner assigned" (#29).
    #
    # 32 GB changes what the build can do, not just how fast it does it:
    # Turbopack's Rust side gets room to run, and webpack's in-memory cache
    # fits again. See the build step below.
    #
    # Cache keys carry only runner.os + runner.arch (macOS / ARM64), neither of
    # which changes here, so the pnpm store and Rust target caches survive.
    if: ${{ !inputs.only_job || inputs.only_job == 'ci-alloomi-macos-arm64' }}
    runs-on: [self-hosted, macos-arm64]
    env:
      SKIP_SIGNING: 'false'
      # Turbopack is back on now that the runner has the memory for it. The
      # compile drops from ~75 min to ~38 min (measured in #33), and the
      # 56-minute thrash it used to hit afterwards is gone with 32 GB.
      USE_TURBOPACK: 'true'
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        # Before the clone and the installs: the stock image ships a dozen
        # Xcodes and the iOS/watchOS simulator runtimes, none of which this job
        # uses, and the build needs every spare gigabyte. See the script for
        # what it prunes and for the MIN_FREE_GB guard.
        #
        # A no-op on the self-hosted EC2 Mac: that image ships no Xcodes and
        # no simulator runtimes, and its 200 GB root volume clears the
        # MIN_FREE_GB guard on its own. The step stays because the guard is
        # the thing that turns a slow build into a clear error.
        run: bash scripts/free-macos-build-disk.sh

      - name: Clone alloomi source code (main branch)
        run: |
          # --depth 1: nothing in the build reads history, and a full clone
          # costs ~800 MB of .git on a 14 GB runner -- disk the webpack cache
          # and the .next/standalone copy need more. It also keeps
          # hashFiles('alloomi/**/pnpm-lock.yaml') under its 120 s ceiling,
          # since that glob walks .git too and blew it on the Intel runners.
          git clone --depth 1 --single-branch --branch "${{ env.ALLOOMI_BRANCH }}" \
            https://x-access-token:${{ secrets.DEPLOY_ACCESS_TOKEN }}@github.com/${{ env.ALLOOMI_REPO }}.git alloomi
          cd alloomi
          if [ "${{ inputs.commit_sha }}" != "" ]; then
            # A shallow clone only carries the branch tip, so an explicitly
            # requested commit has to be fetched on its own. The remote
            # resolves a full object name, so an abbreviated one is expanded
            # against the remote refs first -- "git fetch origin <abbrev>"
            # fails with "couldn't find remote ref" and costs a CI cycle.
            want="${{ inputs.commit_sha }}"
            resolved=$(git ls-remote origin "refs/heads/*" "refs/tags/*" \
              | awk -v want="$want" 'index($1, want) == 1 { print $1 "\t" $2 }')
            count=$(printf '%s\n' "$resolved" | grep -c . || true)
            if [ "$count" = "0" ]; then
              echo "::error::commit_sha '$want' matches no remote ref; pass the full 40-character object name of a commit that is a branch or tag tip"
              exit 1
            fi
            if [ "${#want}" -lt 40 ] && [ "$count" != "1" ]; then
              echo "::error::commit_sha '$want' is ambiguous ($count remote refs match); pass the full 40-character object name"
              exit 1
            fi
            sha=$(printf '%s\n' "$resolved" | head -1 | cut -f1)
            ref=$(printf '%s\n' "$resolved" | head -1 | cut -f2)
            # Fetch the ref instead of the raw object: a remote that refuses
            # a raw object fetch still serves the ref the commit is the tip of.
            git fetch --depth 1 origin "$ref"
            git checkout "$sha"
          fi
          echo "Commit: $(git log -1 --oneline)"

      - name: Stamp nightly version with build date
        id: nightly_version
        run: bash scripts/bump-nightly-version.sh alloomi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Add pnpm to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "PNPM_HOME=$HOME/.local" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools

      - name: Install macOS audio build dependencies
        shell: bash
        run: |
          # Bundled WebRTC audio processing compiles native code with Meson.
          #
          # The self-hosted EC2 Mac keeps Homebrew in /opt/homebrew and does
          # not put it on the PATH of a launchd-started service, so the Apple
          # Silicon prefix is prepended explicitly here. It is the same
          # prefix the GitHub-hosted Apple Silicon runners use, so this is a
          # no-op on them.
          export PATH="/opt/homebrew/bin:$PATH"
          brew install meson ninja pkgconf
          meson --version
          ninja --version
          pkg-config --version

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Get pnpm store directory
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        # v4, not v3: v3 is deprecated (it runs on a Node 16 runtime that
        # GitHub has retired) and it gzips the cache blob. The pnpm store is
        # 3.3 GB of small, highly compressible files, so the zstd compression
        # v4 uses makes the blob markedly smaller -- on the EC2 Mac runner the
        # restore alone took 2m19s and the post-job save another 2m49s.
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          # Name the lockfile rather than globbing alloomi/**: the recursive
          # pattern walks every directory in the checkout, .git included, and
          # blew the 120 s hashFiles ceiling on 2026-10-10 and 2026-10-11 --
          # the job died in template evaluation, before any build step ran.
          # alloomi carries exactly one pnpm-lock.yaml, at its root.
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alloomi/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./alloomi
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy docxodus WASM runtime
        working-directory: ./alloomi
        # --ignore-scripts skips apps/web's postinstall, which is the only
        # step that copies the docxodus .NET WASM runtime into public/.
        # Without it the packaged app's contract-review editor/compare
        # views fail at runtime ("Importing a module script failed").
        run: node apps/web/scripts/copy-docxodus-wasm.cjs

      - name: Link local @melandlabs/integrations facade
        working-directory: ./alloomi
        # apps/web's postinstall also copies the local 0.6.1 facade (which
        # has the composio/channels subpaths the build needs) into
        # node_modules. Without this step, .npmrc's node-linker=hoisted
        # grabs the npm 0.3.0 release instead and webpack fails with
        # "Can't resolve '@melandlabs/integrations/composio'" — see
        # PR #3380 and apps/web/scripts/pnpm-link-integrations-facade.cjs.
        run: node apps/web/scripts/pnpm-link-integrations-facade.cjs

      - name: Install better-sqlite3 prebuilt binary
        working-directory: ./alloomi
        run: |
          pnpm install -w better-sqlite3@12.11.1
          # The first install ran with --ignore-scripts, so the package's
          # install hook (`prebuild-install || node-gyp rebuild`) never ran
          # and the .node binary is missing. Force a rebuild so the hook
          # actually fires (pnpm otherwise sees the package as "already
          # installed" and skips it).
          pnpm rebuild better-sqlite3
          # Keep the nested slot under imessage-kit either absent or a real
          # package. A directory that holds only the native binary shadows
          # the complete root copy: Node's ESM resolver stops at the first
          # `better-sqlite3` directory it finds, so `import("better-sqlite3")`
          # inside imessage-kit rejects with ERR_MODULE_NOT_FOUND and the
          # packaged app reports "better-sqlite3 is required for Node.js
          # runtime" when it opens ~/Library/Messages/chat.db.
          nested=node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3
          if [ -d "$nested" ] && [ ! -f "$nested/package.json" ]; then
            echo "removing binary-only nested better-sqlite3 (it shadows the root copy)"
            rm -rf "$nested"
          fi
          if [ -f "$nested/package.json" ]; then
            mkdir -p "$nested/build/Release"
            cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
               "$nested/build/Release/better_sqlite3.node"
          fi

      - name: Verify native modules are Node v22 compatible
        working-directory: ./alloomi
        run: |
          set -e
          # Load both better-sqlite3 copies via direct file paths. The
          # nested @photon-ai/imessage-kit/node_modules/better-sqlite3 cannot
          # be required by its subpath because imessage-kit's `exports`
          # field does not expose it; we go around the resolver.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const v = process.versions;
            console.log("node:", v.node, "abi:", v.modules);
            if (Number(v.modules) !== 127) {
              console.error("❌ unexpected NODE_MODULE_VERSION (expected 127 for Node 22)");
              process.exit(1);
            }
            // Top-level: what apps/web init-db.cjs requires
            const top = require("better-sqlite3");
            const topDb = new top(":memory:");
            topDb.pragma("user_version = 42");
            if (topDb.pragma("user_version", { simple: true }) !== 42) {
              throw new Error("top-level better-sqlite3 read-back failed");
            }
            topDb.close();
            console.log("✅ top-level better-sqlite3@" + require("better-sqlite3/package.json").version + " loadable on Node", v.node);
            // Nested: only present if pnpm resolved a different version for
            // @photon-ai/imessage-kit. With the root pinned to 12.11.1, the
            // shared version is hoisted and the nested copy disappears.
            const nestedPkgPath = path.join(process.cwd(), "node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3");
            if (fs.existsSync(path.join(nestedPkgPath, "package.json"))) {
              const nested = require(nestedPkgPath);
              const nestedDb = new nested(":memory:");
              nestedDb.pragma("user_version = 7");
              if (nestedDb.pragma("user_version", { simple: true }) !== 7) {
                throw new Error("nested better-sqlite3 read-back failed");
              }
              nestedDb.close();
              console.log("✅ imessage-kit better-sqlite3@" + require(path.join(nestedPkgPath, "package.json")).version + " loadable on Node", v.node);
            } else {
              console.log("ℹ️ imessage-kit nested better-sqlite3 not present (sharing root copy at v" + require("better-sqlite3/package.json").version + ")");
            }
          '

      - name: Create .env file
        working-directory: ./alloomi/apps/web
        run: |
          cat > .env << 'EOF'

          # Cloud API Configuration for Tauri Desktop App
          CLOUD_API_URL=https://app.alloomi.ai
          NEXT_PUBLIC_CLOUD_API_URL=https://app.alloomi.ai

          # Local development URL (for Tauri mode)
          NEXT_PUBLIC_APP_URL=http://localhost:3415

          LLM_BASE_URL=https://openrouter.ai/api/v1
          LLM_MODEL=google/gemini-3-flash-preview
          LLM_REASONING_MODEL=google/gemini-3-flash-preview
          LLM_VISION_LANGUAGE_MODEL=google/gemini-3-flash-preview
          LLM_IMAGE_MODEL=openai/gpt-5-image

          LLM_EMBEDDING_MODEL=qwen/qwen3-embedding-4b
          LLM_EMBEDDING_BASE_URL=https://openrouter.ai/api/v1

          TELEGRAM_MODE=pooling

          ANTHROPIC_BASE_URL=http://localhost:3415/api/ai
          API_TIMEOUT_MS=3000000
          IS_TAURI=true

          EOF

      - name: Enable Outlook (21Vianet) connector
        # Manual-dispatch customer variant only. The flag is read from the .env
        # that ships inside the bundle, so it must live in the file, not just in
        # the build process environment.
        if: inputs.enable_outlook_china
        working-directory: ./alloomi/apps/web
        run: echo "NEXT_PUBLIC_ENABLE_OUTLOOK_CHINA=1" >> .env

      - name: Prepare Apple signing identity
        # The signing preflight lives in a shared composite action: the
        # hosted macOS runners and the EC2 Mac need different keychain
        # shapes, and both macOS jobs now build on the EC2 Mac.
        if: env.SKIP_SIGNING != 'true'
        uses: ./.github/actions/apple-signing
        with:
          app_certificate: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          app_certificate_password: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
          app_signing_identity: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"

      - name: Patch tauri.conf.* to skip bundler on macOS (Apple Silicon)
        # Tauri's own DMG bundler is redundant work on this job. The DMG we
        # ship is built further down by "Create DMG (beautified, from signed
        # app)" via beautify-dmg.js, which is headless-safe (it falls back to
        # the committed .DS_Store template instead of driving Finder), so
        # Tauri's DMG is thrown away right after.
        #
        # It is also the step that killed the job while the build ran on
        # Turbopack (2026-10-21, 2026-10-22 and the 2026-10-22 re-run --
        # 3 of 3): "failed to bundle project error running bundle_dmg.sh".
        # Turbopack's file tracer globs the whole working directory, so the
        # standalone tree the .app embeds grew from well under 1 GB to ~3 GB
        # (2994 MB before the prune in fix-standalone-pnpm.js), and Tauri's
        # bundler could not handle that payload. Tauri runs bundle_dmg.sh
        # through `.output()` and drops the script's stdout/stderr, so the log
        # carries no diagnostics beyond the one-liner above.
        #
        # The build runs on webpack again (see the build step below), so the
        # payload is small enough for the bundler again -- but skipping it
        # still saves the 4-9 min it took to run, and the Intel job has
        # skipped it for much longer. The .app bundle is still produced and
        # signed, and the `rm -f "$DMG_DIR"/Alloomi*.dmg` further down
        # becomes a no-op.
        working-directory: ./alloomi/apps/web
        run: |
          node -e "
            const fs = require('fs');
            // 'pnpm tauri:build' reads whichever regional config ALLOOMI_REGION
            // picks (default: intl → tauri.conf.intl.json); the .json files for
            // intl/cn/dev shadow the base, so patching only tauri.conf.json was
            // a no-op. Loop over every regional config to cover ALLOOMI_REGION
            // = intl|cn|dev and the base for non-CI builds.
            const paths = [
              'src-tauri/tauri.conf.json',
              'src-tauri/tauri.conf.intl.json',
              'src-tauri/tauri.conf.cn.json',
              'src-tauri/tauri.conf.dev.json',
            ];
            for (const path of paths) {
              const c = JSON.parse(fs.readFileSync(path, 'utf8'));
              c.bundle.targets = ['app'];
              fs.writeFileSync(path, JSON.stringify(c, null, 2));
              console.log('Patched ' + path + ' targets to app');
            }
          "

      - name: Cache Rust build (cargo registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace root is at apps/web/src/app/ (single crate).
          # target/ lives next to Cargo.toml. `prefix-key` adds
          # OS+arch so macos-arm64 and macos-amd64 (both runner.os=macos)
          # get separate caches, and the same-arch cache is shared across
          # branches/runs.
          workspaces: ./alloomi/apps/web/src-tauri -> target
          prefix-key: ${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn

      - name: Drop the previous run's app bundle from the Rust cache
        # Swatinem/rust-cache archives all of target/, so after a successful
        # run it also carries target/release/bundle: the signed .app and the
        # notarized DMG that build produced. cargo never reads any of it, but it
        # is gigabytes of dead weight restored onto a 14 GB runner right when the
        # webpack cache and the .next/standalone copy need the same disk.
        run: |
          BUNDLE=alloomi/apps/web/src-tauri/target/release/bundle
          if [ -d "$BUNDLE" ]; then
            du -sh "$BUNDLE"
            rm -rf "$BUNDLE"
          fi

      - name: Restore meeting media SDK cache
        id: meeting-media-cache
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
        uses: actions/cache/restore@v4
        with:
          path: alloomi/.local-dev/gstreamer/downloads
          key: gstreamer-downloads-${{ runner.os }}-${{ hashFiles('alloomi/scripts/meeting-media-probe/prepare-macos-sdk.mjs') }}

      - name: Prepare meeting media GStreamer SDK
        # tauri:build packages the private meeting media runtime first
        # (apps/web/scripts/build-meeting-media.mjs) and fails without this SDK.
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
        working-directory: ./alloomi
        run: node scripts/meeting-media-probe/prepare-macos-sdk.mjs

      - name: Save meeting media SDK cache
        # Saved right after preparing so a later build failure keeps it.
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != '' && steps.meeting-media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: alloomi/.local-dev/gstreamer/downloads
          key: ${{ steps.meeting-media-cache.outputs.cache-primary-key }}

      - name: Restore Next.js build cache
        # The webpack production compile is the long pole of this job (75min of
        # the 94min build step on 2026-10-20) and CI starts cold every run:
        # "No build cache found". Webpack's persistent cache in .next/cache is
        # content-addressed, so restoring an older snapshot still skips
        # recompiling unchanged modules. Key: unique per run so the cache stays
        # fresh (immutable entries), restore-keys picks the latest snapshot for
        # this job/arch/lockfile. Bounded by the 10GB repo cache limit (LRU).
        #
        # Skipped when the build runs on Turbopack: Turbopack writes no
        # persistent build cache, so there is nothing to restore and nothing
        # to save. The cache would just be a multi-GB download the compile
        # never reads.
        if: env.USE_TURBOPACK != 'true'
        id: nextjs-cache
        uses: actions/cache/restore@v4
        with:
          path: alloomi/apps/web/.next/cache
          # Name the lockfile rather than globbing alloomi/**: the recursive
          # pattern walks every file in the checkout -- .git and the hoisted
          # node_modules tree alike (see .npmrc's node-linker=hoisted) -- and
          # blew the 120s hashFiles ceiling on 2026-10-10/11. This step runs
          # AFTER pnpm install, so the walk is at its largest here. Same fix
          # as the pnpm store key above; alloomi carries exactly one
          # pnpm-lock.yaml, at its root.
          key: ${{ github.job }}-nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('alloomi/pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.job }}-nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('alloomi/pnpm-lock.yaml') }}-

      - name: Report runner memory and disk before the build
        # Disk: every cache is restored by now, and this is the headroom
        # `next build` has to fit its webpack cache and the .next/standalone
        # file-tracing copy into.
        #
        # Memory: this job runs on the self-hosted EC2 Mac (12 vCPU / 32 GB,
        # Apple silicon). The GitHub-hosted `macos-15` it replaced had 3 vCPU
        # and 7 GB -- the smallest machine in this workflow -- which is why
        # the build step below used to opt back into the webpack filesystem
        # cache (the in-memory one did not fit) and why the Turbopack
        # experiment in #33 stalled for 56 minutes after the route table.
        #
        # There is deliberately NO swap step here, unlike the Linux job's
        # 8 GB /swapfile. The EC2 Mac lets macOS manage its own dynamic
        # swapfile, so `vm.swapusage` reports a real total here; the
        # GitHub-hosted runners boot with swapping switched off at the host
        # (`total = 0.00M`) and it cannot be turned back on without
        # disabling SIP. `memory_pressure` (not vm_stat) is the honest read on
        # how much is actually claimable: macOS holds most idle RAM as
        # purgeable cache, so vm_stat's "free" looks near-zero on a
        # perfectly healthy runner.
        run: |
          df -h "$GITHUB_WORKSPACE"
          echo "--- memory ---"
          sysctl -n hw.memsize | awk '{printf "physical: %d MB\n", $1 / 1048576}'
          sysctl vm.swapusage || true
          memory_pressure 2>/dev/null | head -5 || true

      - name: Build Tauri app (Apple Silicon)
        working-directory: ./alloomi/apps/web
        # /usr/bin/time -l reports the peak RSS of the whole build tree plus
        # the pageout/swap counters, which is the only place the memory
        # pressure of the build shows up in the log.
        run: |
          # Keep the build output on the machine: the codesign diagnostics
          # only show up in the CI log, and the log is not reachable from the
          # machine this step runs on.
          mkdir -p "$HOME/signing-debug"
          exec > >(tee "$HOME/signing-debug/build.log") 2>&1
          # Tauri picks its signing setup from the environment: with
          # APPLE_CERTIFICATE set it imports the .p12 into a keychain of its
          # own, without it Tauri signs with the identity from the default
          # keychain search list. The preflight step above probed both and
          # reported the one that can sign on this machine, so APPLE_CERTIFICATE
          # is only exported for the variant Tauri has to use. An empty
          # APPLE_CERTIFICATE would not do: tauri-macos-sign only looks at
          # whether the variable is set, not at whether it carries a
          # certificate.
          if [ "${SIGNING_MODE:-job}" = "temp" ]; then
            export APPLE_CERTIFICATE="$APPLE_CERTIFICATE_VALUE"
            export APPLE_CERTIFICATE_PASSWORD="$APPLE_CERTIFICATE_PASSWORD_VALUE"
          fi
          # The preflight step found the identity string codesign accepts on
          # this machine. Tauri signs with the SIGNING_IDENTITY environment
          # variable, so it has to carry that string.
          if [ -n "${CERT_SIGN_IDENTITY:-}" ]; then
            export SIGNING_IDENTITY="$CERT_SIGN_IDENTITY"
          fi
          # The signing identity lives in a keychain with a random password.
          # The preflight step created it, imported the certificate and
          # unlocked it; the unlock state lives in the keychain file, so it
          # is still there in this step. Unlocking again is cheap and covers
          # the case where the 3600s timeout expired between the steps. A
          # locked keychain hides the identity from codesign and the sign
          # fails with "The specified item could not be found in the
          # keychain".
          SIGNING_PASSWORD=$(cat "$RUNNER_TEMP/signing-password" 2>/dev/null || echo "")
          if [ -n "$SIGNING_PASSWORD" ]; then
            for kc in "$RUNNER_TEMP/app-signing.keychain-db" \
                      "$HOME"/Library/Keychains/ci-signing*.keychain-db; do
              [ -e "$kc" ] || continue
              security unlock-keychain -p "$SIGNING_PASSWORD" "$kc" || true
            done
          fi
          /usr/bin/time -l pnpm tauri:build
        env:
          # Type errors are gated in melandlabs/alloomi (.github/workflows/test.yml
          # runs `pnpm tsc` on every push to main). Re-running the check here
          # duplicates that work AND is the memory peak that kills the runner:
          # `next build` type-checks 2900+ files in-process with
          # --max-old-space-size=12288, and the hosted runners get SIGTERMed
          # during "Running TypeScript ...". This job only has to package.
          SKIP_TYPE_CHECK: "true"
          # USE_TURBOPACK comes from the job env: it makes
          # apps/web/scripts/run-tauri-build.js call `next build --turbopack`
          # instead of the webpack build. The compile drops from ~75 min to
          # ~38 min (measured in #33) and it needs no persistent build cache,
          # which is why the .next/cache steps above are skipped.
          #
          # Turbopack's Rust side runs in the same process as the Next.js
          # build, so it is the side that actually wants the RAM. This is an
          # upper bound it tries to stay under: 16 GB leaves 8 GB of the
          # 32 GB runner for the V8 heap (build:turbo caps that at 8 GB) plus
          # the OS and the Tauri/Rust build that follows.
          NEXT_TURBOPACK_MEMORY_LIMIT: "16384"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # Skip the DMG that optimize-tauri-bundle.js packs at the end of the
          # build: the "Create DMG" step below builds it again from the signed
          # .app, so the one packed here is thrown away right after. Packing
          # costs 2-4 min (mount, lay out the .DS_Store, compress to UDZO) and
          # the job used to pay it twice.
          SKIP_DMG_BEAUTIFY: "true"
          # The certificate itself is only handed to Tauri when the preflight
          # step found that the dedicated-keychain variant is the one that
          # signs on this machine; see the run block above.
          APPLE_CERTIFICATE_VALUE: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          APPLE_CERTIFICATE_PASSWORD_VALUE: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
          APPLE_SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          SKIP_SIGNING: 'false'

      - name: Save Next.js build cache
        # Right after the build so a later verify/sign failure keeps it. Even a
        # partial cache from a failed compile is safe to save: entries are
        # content-addressed and webpack discards stale ones on load.
        if: ${{ always() && env.USE_TURBOPACK != 'true' && steps.nextjs-cache.outputs.cache-hit != 'true' && hashFiles('alloomi/apps/web/.next/cache') != '' }}
        uses: actions/cache/save@v4
        with:
          path: alloomi/apps/web/.next/cache
          key: ${{ steps.nextjs-cache.outputs.cache-primary-key }}

      - name: Reclaim the webpack cache once it is saved
        # The cache lives in the Actions cache store by now, so the on-disk copy
        # is just competing with the DMG and notarize steps for the same disk.
        if: env.USE_TURBOPACK != 'true'
        run: rm -rf alloomi/apps/web/.next/cache

      - name: Report runner memory and disk after the build
        # The counterpart of the report before the build: it shows what the
        # build left behind (the .next tree plus the restored Rust target) and
        # how much of the 32 GB was still claimable afterwards. A build that
        # ended with almost nothing free is the one that spent its time in
        # the compressor.
        run: |
          df -h "$GITHUB_WORKSPACE"
          echo "--- memory ---"
          sysctl -n hw.memsize | awk '{printf "physical: %d MB\n", $1 / 1048576}'
          sysctl vm.swapusage || true
          memory_pressure 2>/dev/null | head -5 || true

      - name: Verify the standalone bundle is not bloated
        # The .next/standalone tree is shipped verbatim inside the .app bundle
        # (see src-tauri/tauri.conf.json), so everything the file tracer drags
        # in is paid for twice: once in runner disk and once in the notarized
        # DMG.
        #
        # The file tracer can widen a path it resolved at runtime
        # (homedir(), process.cwd() + a dynamic suffix, ...): it records a bare
        # "<dynamic>" pattern, which expands to every file under the project
        # root -- src-tauri/target (~5 GB) and the test tree (~1 GB) included.
        # That is exactly what the Turbopack runs of 2026-10-21/22 traced
        # (2994 MB before the prune). outputFileTracingExcludes cannot help
        # either, because Next.js traces the instrumentation entry point with
        # page_name = None and only builds the exclude glob when a page name
        # exists. The alloomi repo prunes the over-traced paths afterwards, in
        # apps/web/scripts/fix-standalone-pnpm.js. This step is the guard that
        # the prune keeps working: without it the .app grows past 10 GB.
        working-directory: ./alloomi/apps/web
        run: |
          STANDALONE=.next/standalone
          test -d "$STANDALONE" || { echo "ERROR: $STANDALONE is missing"; exit 1; }
          for dir in apps/web/src-tauri apps/web/tests apps/web/cli-bundle/.claude; do
            if [ -d "$STANDALONE/$dir" ]; then
              echo "ERROR: the standalone bundle contains $dir/ -- the file tracer globbed the working directory"
              exit 1
            fi
          done
          # A stray .env in the bundle would ship the build machine's secrets.
          for env_file in "$STANDALONE"/apps/web/.env "$STANDALONE"/apps/web/.env.*; do
            if [ -f "$env_file" ]; then
              echo "ERROR: the standalone bundle contains $env_file"
              exit 1
            fi
          done
          # The monorepo root package.json decides the module type of every
          # .js file under skills/ that has no package.json of its own. Without
          # it those ESM scripts are parsed as CommonJS and die on their first
          # import statement.
          test -f "$STANDALONE/package.json" || {
            echo "ERROR: $STANDALONE/package.json is missing -- the bundled skill scripts would be parsed as CommonJS"
            exit 1
          }
          SIZE_KB=$(du -sk "$STANDALONE" | awk '{print $1}')
          echo "standalone size: $((SIZE_KB / 1024)) MB"
          if [ "$SIZE_KB" -gt 2097152 ]; then
            echo "ERROR: the standalone bundle is $((SIZE_KB / 1024)) MB, expected well under 2 GB"
            exit 1
          fi

      - name: Verify meeting media runtime is in the app bundle
        # Meeting recording runs through this helper; an app without it builds
        # fine but cannot record.
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
        run: |
          RUNTIME="./alloomi/apps/web/src-tauri/target/release/bundle/macos/Alloomi.app/Contents/Resources/resources/meeting-media"
          test -x "$RUNTIME/bin/alloomi-meeting-media" && test -f "$RUNTIME/manifest.json"
          codesign --verify --strict --verbose=2 "$RUNTIME/bin/alloomi-meeting-media"

      - name: Verify imessage-kit package files are in the standalone bundle
        # Regression guard for the v0.6.6 crash:
        # "Cannot find package '@photon-ai/imessage-kit/index.js'". The script
        # apps/web/scripts/fix-standalone-pnpm.js must land the package's
        # own files (package.json, dist/index.js, dist/index.cjs) into the
        # standalone tree -- otherwise Node falls back to index.js at the
        # package root and throws at runtime.
        working-directory: ./alloomi/apps/web
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = ".next/standalone/apps/web/node_modules/@photon-ai/imessage-kit";
            const missing = ["package.json", "dist/index.js", "dist/index.cjs"]
              .filter(rel => !fs.existsSync(path.join(root, rel)));
            if (missing.length) {
              console.error("ERROR: standalone is missing @photon-ai/imessage-kit files: " + missing.join(", "));
              console.error("       See apps/web/scripts/fix-standalone-pnpm.js -- copyIMessageKitPackage step");
              process.exit(1);
            }
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            if (!pkg.exports || !pkg.exports["."] || !pkg.exports["."].require) {
              console.error("ERROR: imessage-kit/package.json missing exports map; Node will fall back to index.js at root");
              process.exit(1);
            }
            console.log("OK: imessage-kit package files present in standalone bundle");
          '

      - name: Verify pdf.js runtime files are in the standalone bundle
        # Regression guard for the mailbox refresh hang: pdfjs-dist's legacy
        # build runs `new DOMMatrix()` at module top level and polyfills it by
        # require("@napi-rs/canvas"); the worker is loaded by dynamic path.
        # Next's file tracing copies neither, so the import rejects, officeparser's
        # fire-and-forget parsePdf() never invokes its callback, and
        # parseOfficeAsync() stays pending forever -- holding that bot's slot in
        # the serialized refresh queue until the app restarts. The script
        # apps/web/scripts/fix-standalone-pnpm.js must land both into the
        # standalone tree.
        working-directory: ./alloomi/apps/web
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const nm = ".next/standalone/node_modules";
            const missing = [
              "@napi-rs/canvas/package.json",
              "pdfjs-dist/legacy/build/pdf.worker.mjs",
            ].filter(rel => !fs.existsSync(path.join(nm, rel)));
            if (missing.length) {
              console.error("ERROR: standalone is missing pdf.js runtime files: " + missing.join(", "));
              console.error("       See apps/web/scripts/fix-standalone-pnpm.js -- copyPdfRuntime step");
              process.exit(1);
            }
            // Loading it proves the prebuilt binary matches this runner (a copy of
            // the wrong platform still resolves on disk but fails to dlopen).
            let DOMMatrix;
            try {
              ({ DOMMatrix } = require(path.resolve(nm, "@napi-rs/canvas")));
              new DOMMatrix();
            } catch (err) {
              console.error("ERROR: @napi-rs/canvas is present but will not load on this runner: " + err.message);
              console.error("       See apps/web/scripts/fix-standalone-pnpm.js -- copyPdfRuntime step");
              process.exit(1);
            }
            if (typeof DOMMatrix !== "function") {
              console.error("ERROR: @napi-rs/canvas exposes no DOMMatrix; pdf.js cannot load under Node");
              process.exit(1);
            }
            console.log("OK: pdf.js runtime (canvas polyfill + worker) present in standalone bundle");
          '

      - name: Verify finalized app signatures
        if: env.SKIP_SIGNING != 'true'
        run: |
          set -e
          APP_BUNDLE="./alloomi/apps/web/src-tauri/target/release/bundle/macos/Alloomi.app"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          echo "✅ App bundle signatures verified"

      - name: Create DMG (beautified, from signed app)
        env:
          # Build-step env is scoped per-step, so re-inject the identity used
          # to sign the DMG container itself.
          APPLE_SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
        run: |
          set -e

          APP_BUNDLE="./alloomi/apps/web/src-tauri/target/release/bundle/macos/Alloomi.app"
          DMG_DIR="./alloomi/apps/web/src-tauri/target/release/bundle/dmg"
          SRC_TAURI="./alloomi/apps/web/src-tauri"
          mkdir -p "$DMG_DIR"

          # optimize-tauri-bundle.js has already finalized $APP_BUNDLE using
          # Alloomi's inside-out signer. beautify-dmg.js only
          # `cp -R`s the .app into the DMG (never modifies its contents), so the
          # signature survives intact → notarization can cover the inner .app →
          # no more "已损坏，无法打开" on install. (Previously we copied the DMG
          # tauri:build emitted, whose inner .app was signed BEFORE the Developer
          # ID step, so the DMG shipped an unsigned ad-hoc .app.)
          echo "Verifying app signature before packing DMG..."
          codesign -dv "$APP_BUNDLE" 2>&1 | head -5

          # Drop any DMG tauri:build left behind so the glob below is unambiguous.
          rm -f "$DMG_DIR"/Alloomi*.dmg

          # Regenerate the beautified DMG against the SIGNED .app. The script
          # auto-discovers appPath + outDmg from target/release/bundle, reads the
          # version from tauri.conf.json, and emits Alloomi_<version>_aarch64.dmg.
          # Under CI (env CI=true) it uses the committed .DS_Store template
          # (resources/dmg_DS_Store) since the runner has no Finder/Aqua session.
          pushd "$SRC_TAURI" >/dev/null
          node scripts/beautify-dmg.js
          popd >/dev/null

          VERSION=$(node -p "require('./alloomi/apps/web/src-tauri/tauri.conf.json').version")
          BEAUTIFIED_DMG="$DMG_DIR/Alloomi_${VERSION}_aarch64.dmg"

          if [ ! -f "$BEAUTIFIED_DMG" ]; then
            echo "❌ Beautified DMG not found: $BEAUTIFIED_DMG"
            ls -la "$DMG_DIR" 2>/dev/null || true
            exit 1
          fi

          # Guard against beautify-dmg.js failing silently: a DMG with no
          # .background/ means the layout never landed.
          ATTACH=$(hdiutil attach -nobrowse -noverify "$BEAUTIFIED_DMG" | grep -o '/Volumes/Alloomi.*' | tail -1)
          if [ -z "$ATTACH" ] || [ ! -d "$ATTACH/.background" ]; then
            echo "❌ DMG has no .background/ — beautification did not run"
            [ -n "$ATTACH" ] && hdiutil detach "$ATTACH" -force
            exit 1
          fi
          hdiutil detach "$ATTACH" -force

          # Rename to the CI convention; downstream Notarize/Staple/Upload glob
          # Alloomi*.dmg, so we leave exactly ONE DMG in dmg/.
          COMMIT_SHA=$(cd alloomi && git rev-parse --short HEAD)
          DMG_PATH="$DMG_DIR/Alloomi_ci_${COMMIT_SHA}_aarch64.dmg"
          mv "$BEAUTIFIED_DMG" "$DMG_PATH"

          # Sign the DMG *container* itself. notarytool requires the submitted
          # DMG (not just the inner .app) to carry a Developer ID signature;
          # otherwise `xcrun notarytool submit` fails with
          # "code object is not signed at all". beautify-dmg.js only `hdiutil`s
          # the already-signed .app into the DMG and never signs the DMG, so we
          # add it here: Sign app → pack DMG → sign DMG → notarize → staple.
          #
          # The identity is looked up in the default keychain search list, and
          # the preflight step gave the keychains a random password, so unlock
          # them first: a locked keychain hides the identity from codesign.
          SIGNING_PASSWORD=$(cat "$RUNNER_TEMP/signing-password" 2>/dev/null || echo "")
          if [ -n "$SIGNING_PASSWORD" ]; then
            for kc in "$RUNNER_TEMP/app-signing.keychain-db" \
                      "$HOME"/Library/Keychains/ci-signing*.keychain-db; do
              [ -e "$kc" ] || continue
              security unlock-keychain -p "$SIGNING_PASSWORD" "$kc" || true
            done
          fi
          codesign --force --sign "${CERT_SIGN_IDENTITY:-$APPLE_SIGNING_IDENTITY}" "$DMG_PATH"
          codesign -dv "$DMG_PATH" 2>&1 | head -5

          echo "✅ Beautified DMG (from signed app) at: $DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Notarize DMG
        if: env.SKIP_SIGNING != 'true'
        timeout-minutes: 360
        run: |
          DMG_PATH=$(ls ./alloomi/apps/web/src-tauri/target/release/bundle/dmg/Alloomi*.dmg)
          echo "Notarizing: $DMG_PATH"

          codesign -dv "$DMG_PATH" 2>&1 | head -5

          APPLE_ID="${{ secrets.ED_APPLE_ID }}"
          APPLE_PASSWORD="${{ secrets.ED_APPLE_PASSWORD }}"
          APPLE_TEAM_ID="${{ secrets.ED_APPLE_TEAM_ID }}"

          # `set -e` (default for GitHub Actions `run:` blocks) aborts the whole
          # script on a failing command substitution, so a failed `notarytool
          # submit` would exit BEFORE the `echo "$OUTPUT"` that prints its error
          # — leaving only "Signature size=9045" then "exit 1" in the log. Run
          # submit under `set +e` and capture output without aborting, so the
          # real notarytool error (auth failure, code rejection, etc.) always
          # surfaces.
          set +e
          OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          SUBMIT_EXIT=$?
          set -e

          echo "----- notarytool submit output (exit=$SUBMIT_EXIT) -----"
          echo "$OUTPUT"
          echo "--------------------------------------------------------"

          if [ "$SUBMIT_EXIT" -ne 0 ]; then
            echo "❌ notarytool submit failed (exit=$SUBMIT_EXIT). See output above."
            exit 1
          fi

          SUBMISSION_ID=$(echo "$OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "❌ notarytool submit returned no submission id. See output above."
            exit 1
          fi

          echo "Submission ID: $SUBMISSION_ID"

          echo "Waiting for notarization to complete..."
          set +e
          WAIT_OUTPUT=$(xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          WAIT_EXIT=$?
          set -e

          echo "----- notarytool wait output (exit=$WAIT_EXIT) -----"
          echo "$WAIT_OUTPUT"
          echo "--------------------------------------------------------"

          if echo "$WAIT_OUTPUT" | grep -q "status: Rejected"; then
            echo "❌ Notarization rejected. Fetching Apple's detailed log..."
            # The Apple-side log explains exactly why the DMG/.app was rejected
            # (e.g. "the binary is not signed", "code failed to satisfy
            # designated code requirement"). This is the decisive diagnostic.
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 || true
            exit 1
          elif echo "$WAIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "✅ Notarization accepted!"
          else
            echo "❌ Notarization status unclear (exit=$WAIT_EXIT). See output above."
            exit 1
          fi

          # No sleep here on purpose. Apple's ticket does not appear the
          # instant `notarytool wait` reports "Accepted": the submission has
          # to be published to the notary service first, which takes a while.
          # This step used to wait a flat 300 s for that, and the Staple DMG
          # step below already covers it properly -- it retries `stapler
          # staple` 20 times, 60 s apart, so it tolerates up to 20 minutes of
          # propagation delay. The 300 s sleep was pure waiting on top of a
          # retry loop that already waits for the same thing: on 2026-10-23
          # the sleep ended at 13:11:30 and the very first staple attempt
          # finished 0.4 s later, so the ticket had been ready for minutes.
          # Dropping the sleep takes 5 minutes off every signed build.

      - name: Staple DMG
        if: env.SKIP_SIGNING != 'true'
        continue-on-error: true
        run: |
          DMG_PATH=$(ls ./alloomi/apps/web/src-tauri/target/release/bundle/dmg/Alloomi*.dmg)
          echo "Stapling: $DMG_PATH"

          STAPLED=false
          for i in $(seq 1 20); do
            echo "Staple attempt $i..."
            if xcrun stapler staple "$DMG_PATH" 2>&1; then
              echo "✅ Staple succeeded on attempt $i"
              STAPLED=true
              break
            else
              echo "Staple failed, waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          if [ "$STAPLED" = "true" ]; then
            if xcrun stapler validate "$DMG_PATH" 2>&1; then
              echo "✅ DMG stapled and validated successfully"
            else
              echo "❌ DMG stapled but validation failed"
              exit 1
            fi
          else
            echo "⚠️  Failed to staple DMG after 20 attempts"
          fi

      - name: Upload CI DMG
        uses: actions/upload-artifact@v4
        with:
          name: alloomi-ci-dmg-macos${{ inputs.enable_outlook_china && '-outlook-china' || '' }}
          path: ${{ github.workspace }}/alloomi/apps/web/src-tauri/target/release/bundle/dmg/Alloomi*.dmg

      - name: Drop the app bundle before the Rust cache is saved
        # Last step on purpose: the DMG is uploaded, so nothing else needs
        # target/release/bundle. The post-job Swatinem/rust-cache save
        # archives all of target/, and leaving the .app and DMG in place is
        # what made the next run restore gigabytes of a stale artifact --
        # see "Drop the previous run's app bundle from the Rust cache".
        run: rm -rf alloomi/apps/web/src-tauri/target/release/bundle

  # ─── macOS amd64 CI ────────────────────────────────────────────────────────
  ci-alloomi-macos-amd64:
    # Builds the Intel bundle on the same self-hosted EC2 Mac as the arm64
    # job, by cross-compiling for x86_64-apple-darwin. Rosetta 2 runs the
    # x86_64 Node (and with it the x86_64 native modules and the x86_64
    # Turbopack binary); the Rust side cross-compiles natively.
    #
    # This job used to run on the GitHub-hosted macos-15-intel runner
    # (4 vCPU / 14 GB) and took 94 minutes: the Turbopack compile alone ran
    # 14-36 minutes and the Rust build another 11-18. The same build on the
    # EC2 Mac (12 vCPU / 32 GB) compiles in 94 seconds and links the Rust in
    # 1m23s, so the Intel job drops to roughly the length of the arm64 one.
    #
    # The two jobs share the runner, so they run one after the other instead
    # of in parallel: ~23 min + ~30 min beats 23 min + 94 min.
    if: ${{ !inputs.only_job || inputs.only_job == 'ci-alloomi-macos-amd64' }}
    runs-on: [self-hosted, macos-arm64]
    env:
      SKIP_SIGNING: 'false'
      # Turbopack for the Next.js production build -- see the build step below.
      USE_TURBOPACK: 'true'
      # The Rust target this job builds for. Cargo nests the triple under
      # the target directory, so the .app lands in
      # src-tauri/target/x86_64-apple-darwin/release/bundle instead of
      # src-tauri/target/release/bundle. The alloomi build scripts read the
      # same variable (apps/web/scripts/tauri-target.mjs) to find it, and
      # the steps below use TAURI_BUNDLE_DIR to find it from the workflow.
      ALLOOMI_TAURI_TARGET: x86_64-apple-darwin
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        # Before the clone and the installs. A no-op on the self-hosted EC2
        # Mac -- that image ships no Xcodes and no simulator runtimes, and
        # its 200 GB root volume clears the MIN_FREE_GB guard on its own --
        # but the guard is the thing that turns a slow build into a clear
        # error, and this job now runs on the same machine as the arm64 one.
        run: bash scripts/free-macos-build-disk.sh

      - name: Clone alloomi source code (main branch)
        run: |
          # --depth 1, like the arm64 job: nothing in the build reads
          # history, and a full clone costs ~800 MB of .git -- disk the
          # .next/standalone copy and the Rust target need more. It also
          # keeps hashFiles('alloomi/**/pnpm-lock.yaml') under its 120 s
          # ceiling, since that glob walks .git too.
          git clone --depth 1 --single-branch --branch "${{ env.ALLOOMI_BRANCH }}" \
            https://x-access-token:${{ secrets.DEPLOY_ACCESS_TOKEN }}@github.com/${{ env.ALLOOMI_REPO }}.git alloomi
          cd alloomi
          if [ "${{ inputs.commit_sha }}" != "" ]; then
            # A shallow clone only carries the branch tip, so an explicitly
            # requested commit has to be fetched on its own. The remote
            # resolves a full object name, so an abbreviated one is expanded
            # against the remote refs first -- "git fetch origin <abbrev>"
            # fails with "couldn't find remote ref" and costs a CI cycle.
            want="${{ inputs.commit_sha }}"
            resolved=$(git ls-remote origin "refs/heads/*" "refs/tags/*" \
              | awk -v want="$want" 'index($1, want) == 1 { print $1 "\t" $2 }')
            count=$(printf '%s\n' "$resolved" | grep -c . || true)
            if [ "$count" = "0" ]; then
              echo "::error::commit_sha '$want' matches no remote ref; pass the full 40-character object name of a commit that is a branch or tag tip"
              exit 1
            fi
            if [ "${#want}" -lt 40 ] && [ "$count" != "1" ]; then
              echo "::error::commit_sha '$want' is ambiguous ($count remote refs match); pass the full 40-character object name"
              exit 1
            fi
            sha=$(printf '%s\n' "$resolved" | head -1 | cut -f1)
            ref=$(printf '%s\n' "$resolved" | head -1 | cut -f2)
            # Fetch the ref instead of the raw object: a remote that refuses
            # a raw object fetch still serves the ref the commit is the tip of.
            git fetch --depth 1 origin "$ref"
            git checkout "$sha"
          fi
          echo "Commit: $(git log -1 --oneline)"

      - name: Stamp nightly version with build date
        id: nightly_version
        run: bash scripts/bump-nightly-version.sh alloomi

      - name: Install Rosetta 2
        # The x86_64 Node that this job needs is an x86_64 Mach-O binary,
        # and an x86_64 binary only runs on Apple silicon through Rosetta 2.
        # The EC2 Mac image does not ship it.
        #
        # Installing it is a one-off: the check below short-circuits once it
        # is there, so every later run takes the fast path. The runner user
        # has passwordless sudo -- the signing preflight relies on it for
        # the system keychain.
        run: |
          set -e
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 is already installed"
          else
            echo "Rosetta 2 is missing -- installing it"
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          # The proof that it works: an x86_64 slice of a universal binary
          # runs. Without Rosetta this fails with "Bad CPU type in
          # executable".
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The x86_64 Node. The job builds an Intel app on an Apple silicon
          # machine, so every native module in node_modules has to be the
          # darwin-x64 one -- and pnpm picks those because the Node that
          # runs it reports process.arch = x64. Rosetta 2 translates the
          # binary; the arm64 Node in the same PATH would load arm64
          # modules and the packaged app would fail on an Intel Mac.
          architecture: 'x64'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Add pnpm to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "PNPM_HOME=$HOME/.local" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools

      - name: Install macOS audio build dependencies
        shell: bash
        run: |
          # Bundled WebRTC audio processing compiles native code with Meson.
          export PATH="/opt/homebrew/bin:$PATH"
          brew install meson ninja pkgconf
          meson --version
          ninja --version
          pkg-config --version

      - name: Install Rust targets
        run: |
          # The cross target this job compiles for. The host toolchain stays
          # arm64, so the build scripts and the proc macros are compiled for
          # the host and run natively -- only the artifacts are x86_64.
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Resolve the Tauri bundle directory
        run: |
          # Cargo nests the target triple under the target directory
          # whenever --target is passed, so the bundle of a cross build
          # lives one level deeper than a native one. Every step below
          # reads this variable instead of hardcoding the path.
          if [ -n "${ALLOOMI_TAURI_TARGET:-}" ]; then
            echo "TAURI_BUNDLE_DIR=alloomi/apps/web/src-tauri/target/${ALLOOMI_TAURI_TARGET}/release/bundle" >> "$GITHUB_ENV"
          else
            echo "TAURI_BUNDLE_DIR=alloomi/apps/web/src-tauri/target/release/bundle" >> "$GITHUB_ENV"
          fi
          echo "TAURI_BUNDLE_DIR=$TAURI_BUNDLE_DIR"

      - name: Get pnpm store directory
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        # v4, not v3: v3 is deprecated (it runs on a Node 16 runtime that
        # GitHub has retired) and it gzips the cache blob. The pnpm store is
        # 3.3 GB of small, highly compressible files, so the zstd compression
        # v4 uses makes the blob markedly smaller -- on the EC2 Mac runner the
        # restore alone took 2m19s and the post-job save another 2m49s.
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          # Name the lockfile rather than globbing alloomi/**: the recursive
          # pattern walks every directory in the checkout, .git included, and
          # blew the 120 s hashFiles ceiling on 2026-10-10 and 2026-10-11 --
          # the job died in template evaluation, before any build step ran.
          # alloomi carries exactly one pnpm-lock.yaml, at its root.
          #
          # The same key as the arm64 job's: the store is content-addressed
          # and the two jobs install the same lockfile, so they can share
          # one blob. The arch-specific packages (the SWC/Turbopack binary,
          # sharp, chromium) are the exception -- the first job to save owns
          # the entry, so the other one re-downloads its own variants on
          # every run. That is a couple of hundred megabytes, cheaper than
          # a second 3.3 GB blob and a second multi-minute save.
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alloomi/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./alloomi
        env:
          # The x86_64 variants of the platform-specific optional
          # dependencies (the Next.js SWC/Turbopack binary, sharp,
          # @sparticuz/chromium). The x64 Node already reports
          # process.arch = x64; this makes the intent explicit and keeps
          # the resolution correct if the install ever runs under a
          # different Node.
          npm_config_arch: x64
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy docxodus WASM runtime
        working-directory: ./alloomi
        # --ignore-scripts skips apps/web's postinstall, which is the only
        # step that copies the docxodus .NET WASM runtime into public/.
        # Without it the packaged app's contract-review editor/compare
        # views fail at runtime ("Importing a module script failed").
        run: node apps/web/scripts/copy-docxodus-wasm.cjs

      - name: Link local @melandlabs/integrations facade
        working-directory: ./alloomi
        # apps/web's postinstall also copies the local 0.6.1 facade (which
        # has the composio/channels subpaths the build needs) into
        # node_modules. Without this step, .npmrc's node-linker=hoisted
        # grabs the npm 0.3.0 release instead and webpack fails with
        # "Can't resolve '@melandlabs/integrations/composio'" — see
        # PR #3380 and apps/web/scripts/pnpm-link-integrations-facade.cjs.
        run: node apps/web/scripts/pnpm-link-integrations-facade.cjs

      - name: Install better-sqlite3 prebuilt binary (x86_64)
        working-directory: ./alloomi
        env:
          npm_config_arch: x64
        run: |
          pnpm install -w better-sqlite3@12.11.1
          # The first install ran with --ignore-scripts, so the package's
          # install hook (`prebuild-install || node-gyp rebuild`) never ran
          # and the .node binary is missing. Force a rebuild so the hook
          # actually fires (pnpm otherwise sees the package as "already
          # installed" and skips it).
          pnpm rebuild better-sqlite3
          # Keep the nested slot under imessage-kit either absent or a real
          # package. A directory that holds only the native binary shadows
          # the complete root copy: Node's ESM resolver stops at the first
          # `better-sqlite3` directory it finds, so `import("better-sqlite3")`
          # inside imessage-kit rejects with ERR_MODULE_NOT_FOUND and the
          # packaged app reports "better-sqlite3 is required for Node.js
          # runtime" when it opens ~/Library/Messages/chat.db.
          nested=node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3
          if [ -d "$nested" ] && [ ! -f "$nested/package.json" ]; then
            echo "removing binary-only nested better-sqlite3 (it shadows the root copy)"
            rm -rf "$nested"
          fi
          if [ -f "$nested/package.json" ]; then
            mkdir -p "$nested/build/Release"
            cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
               "$nested/build/Release/better_sqlite3.node"
          fi

      - name: Verify native modules are Node v22 compatible
        working-directory: ./alloomi
        run: |
          set -e
          # Load both better-sqlite3 copies via direct file paths. The
          # nested @photon-ai/imessage-kit/node_modules/better-sqlite3 cannot
          # be required by its subpath because imessage-kit's `exports`
          # field does not expose it; we go around the resolver.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const v = process.versions;
            console.log("node:", v.node, "abi:", v.modules);
            if (Number(v.modules) !== 127) {
              console.error("❌ unexpected NODE_MODULE_VERSION (expected 127 for Node 22)");
              process.exit(1);
            }
            // Top-level: what apps/web init-db.cjs requires
            const top = require("better-sqlite3");
            const topDb = new top(":memory:");
            topDb.pragma("user_version = 42");
            if (topDb.pragma("user_version", { simple: true }) !== 42) {
              throw new Error("top-level better-sqlite3 read-back failed");
            }
            topDb.close();
            console.log("✅ top-level better-sqlite3@" + require("better-sqlite3/package.json").version + " loadable on Node", v.node);
            // Nested: only present if pnpm resolved a different version for
            // @photon-ai/imessage-kit. With the root pinned to 12.11.1, the
            // shared version is hoisted and the nested copy disappears.
            const nestedPkgPath = path.join(process.cwd(), "node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3");
            if (fs.existsSync(path.join(nestedPkgPath, "package.json"))) {
              const nested = require(nestedPkgPath);
              const nestedDb = new nested(":memory:");
              nestedDb.pragma("user_version = 7");
              if (nestedDb.pragma("user_version", { simple: true }) !== 7) {
                throw new Error("nested better-sqlite3 read-back failed");
              }
              nestedDb.close();
              console.log("✅ imessage-kit better-sqlite3@" + require(path.join(nestedPkgPath, "package.json")).version + " loadable on Node", v.node);
            } else {
              console.log("ℹ️ imessage-kit nested better-sqlite3 not present (sharing root copy at v" + require("better-sqlite3/package.json").version + ")");
            }
          '

      - name: Create .env file
        working-directory: ./alloomi/apps/web
        run: |
          cat > .env << 'EOF'

          CLOUD_API_URL=https://app.alloomi.ai
          NEXT_PUBLIC_CLOUD_API_URL=https://app.alloomi.ai
          NEXT_PUBLIC_APP_URL=http://localhost:3415
          LLM_BASE_URL=https://openrouter.ai/api/v1
          LLM_MODEL=google/gemini-3-flash-preview
          LLM_REASONING_MODEL=google/gemini-3-flash-preview
          LLM_VISION_LANGUAGE_MODEL=google/gemini-3-flash-preview
          LLM_IMAGE_MODEL=openai/gpt-5-image
          LLM_EMBEDDING_MODEL=qwen/qwen3-embedding-4b
          LLM_EMBEDDING_BASE_URL=https://openrouter.ai/api/v1
          TELEGRAM_MODE=pooling

          ANTHROPIC_BASE_URL=http://localhost:3415/api/ai
          API_TIMEOUT_MS=3000000
          IS_TAURI=true

          EOF

      - name: Enable Outlook (21Vianet) connector
        # Manual-dispatch customer variant only. The flag is read from the .env
        # that ships inside the bundle, so it must live in the file, not just in
        # the build process environment.
        if: inputs.enable_outlook_china
        working-directory: ./alloomi/apps/web
        run: echo "NEXT_PUBLIC_ENABLE_OUTLOOK_CHINA=1" >> .env

      - name: Prepare Apple signing identity
        # The signing preflight lives in a shared composite action: the
        # hosted macOS runners and the EC2 Mac need different keychain
        # shapes, and this job now builds on the EC2 Mac.
        if: env.SKIP_SIGNING != 'true'
        uses: ./.github/actions/apple-signing
        with:
          app_certificate: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          app_certificate_password: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
          app_signing_identity: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"

      - name: Patch tauri.conf.* to skip bundler on macOS (Intel)
        working-directory: ./alloomi/apps/web
        run: |
          node -e "
            const fs = require('fs');
            // 'pnpm tauri:build' reads whichever regional config ALLOOMI_REGION
            // picks (default: intl → tauri.conf.intl.json); the .json files for
            // intl/cn/dev shadow the base, so patching only tauri.conf.json was
            // a no-op. Loop over every regional config to cover ALLOOMI_REGION
            // = intl|cn|dev and the base for non-CI builds.
            const paths = [
              'src-tauri/tauri.conf.json',
              'src-tauri/tauri.conf.intl.json',
              'src-tauri/tauri.conf.cn.json',
              'src-tauri/tauri.conf.dev.json',
            ];
            for (const path of paths) {
              const c = JSON.parse(fs.readFileSync(path, 'utf8'));
              c.bundle.targets = ['app'];
              fs.writeFileSync(path, JSON.stringify(c, null, 2));
              console.log('Patched ' + path + ' targets to app');
            }
          "

      - name: Cache Rust build (cargo registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./alloomi/apps/web/src-tauri -> target
          # Its own prefix: the arm64 job caches the aarch64 artifacts of the
          # same target/ directory, and a shared key would mean one of the
          # two jobs could never save (GitHub cache entries are immutable) --
          # whichever ran first would own the entry forever.
          prefix-key: ${{ runner.os }}-${{ runner.arch }}-x86_64
          if-no-files-found: warn

      - name: Drop the previous run's app bundle from the Rust cache
        # The counterpart of the arm64 job's step of the same name. The
        # cross build nests its bundle one level deeper, under the target
        # triple, so the path is different -- but the reasoning is the same:
        # Swatinem/rust-cache archives all of target/, so after a successful
        # run it also carries the signed .app and the notarized DMG that
        # build produced. cargo never reads any of it, but it is gigabytes
        # of dead weight restored onto the runner right when the .next/
        # standalone copy needs the same disk.
        run: |
          BUNDLE="$TAURI_BUNDLE_DIR"
          if [ -d "$BUNDLE" ]; then
            du -sh "$BUNDLE"
            rm -rf "$BUNDLE"
          fi

      - name: Restore meeting media SDK cache
        id: meeting-media-cache
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
        uses: actions/cache/restore@v4
        with:
          path: alloomi/.local-dev/gstreamer/downloads
          key: gstreamer-downloads-${{ runner.os }}-${{ hashFiles('alloomi/scripts/meeting-media-probe/prepare-macos-sdk.mjs') }}

      - name: Prepare meeting media GStreamer SDK
        # tauri:build packages the private meeting media runtime first
        # (apps/web/scripts/build-meeting-media.mjs) and fails without this SDK.
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
        working-directory: ./alloomi
        run: node scripts/meeting-media-probe/prepare-macos-sdk.mjs

      - name: Save meeting media SDK cache
        # Saved right after preparing so a later build failure keeps it.
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != '' && steps.meeting-media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: alloomi/.local-dev/gstreamer/downloads
          key: ${{ steps.meeting-media-cache.outputs.cache-primary-key }}

      - name: Build Tauri app (Intel)
        working-directory: ./alloomi/apps/web
        # /usr/bin/time -l reports the peak RSS of the whole build tree plus
        # the pageout/swap counters -- the only place the memory pressure of
        # the build shows up in the log.
        run: |
          # Keep the build output on the machine: the codesign diagnostics
          # only show up in the CI log, and the log is not reachable from the
          # machine this step runs on.
          mkdir -p "$HOME/signing-debug"
          exec > >(tee "$HOME/signing-debug/build.log") 2>&1
          # Tauri picks its signing setup from the environment: with
          # APPLE_CERTIFICATE set it imports the .p12 into a keychain of its
          # own, without it Tauri signs with the identity from the default
          # keychain search list. The preflight step above probed both and
          # reported the one that can sign on this machine, so APPLE_CERTIFICATE
          # is only exported for the variant Tauri has to use. An empty
          # APPLE_CERTIFICATE would not do: tauri-macos-sign only looks at
          # whether the variable is set, not at whether it carries a
          # certificate.
          if [ "${SIGNING_MODE:-job}" = "temp" ]; then
            export APPLE_CERTIFICATE="$APPLE_CERTIFICATE_VALUE"
            export APPLE_CERTIFICATE_PASSWORD="$APPLE_CERTIFICATE_PASSWORD_VALUE"
          fi
          # The preflight step found the identity string codesign accepts on
          # this machine. Tauri signs with the SIGNING_IDENTITY environment
          # variable, so it has to carry that string.
          if [ -n "${CERT_SIGN_IDENTITY:-}" ]; then
            export SIGNING_IDENTITY="$CERT_SIGN_IDENTITY"
          fi
          # The signing identity lives in a keychain with a random password.
          # The preflight step created it, imported the certificate and
          # unlocked it; the unlock state lives in the keychain file, so it
          # is still there in this step. Unlocking again is cheap and covers
          # the case where the 3600s timeout expired between the steps. A
          # locked keychain hides the identity from codesign and the sign
          # fails with "The specified item could not be found in the
          # keychain".
          SIGNING_PASSWORD=$(cat "$RUNNER_TEMP/signing-password" 2>/dev/null || echo "")
          if [ -n "$SIGNING_PASSWORD" ]; then
            for kc in "$RUNNER_TEMP/app-signing.keychain-db" \
                      "$HOME"/Library/Keychains/ci-signing*.keychain-db; do
              [ -e "$kc" ] || continue
              security unlock-keychain -p "$SIGNING_PASSWORD" "$kc" || true
            done
          fi
          /usr/bin/time -l pnpm tauri:build
        env:
          SKIP_TYPE_CHECK: "true" # see ci-alloomi-macos-arm64
          # Turbopack, same as the arm64 job. It compiles in Rust with its
          # own allocator, so there is no V8 heap ceiling to hit and it
          # writes no persistent build cache -- which is why this job never
          # had the "Restore/Save Next.js build cache" steps the arm64 job
          # has, and why there is nothing to remove here.
          #
          # The thrash that made #33 fail was the arm64 job's 7 GB
          # macos-15: the compile outgrew the RAM and the machine had
          # nowhere to page to. This job used to run on macos-15-intel with
          # 14 GB; it now runs on the EC2 Mac (12 vCPU / 32 GB), where the
          # same compile takes 94 seconds.
          #
          # NEXT_TURBOPACK_MEMORY_LIMIT is deliberately NOT set here. It caps
          # Turbopack's Rust side, and a cap that is too low turns the compile
          # into an internal GC thrash -- a new failure mode instead of the
          # old one. Leaving it unset keeps the exact configuration that was
          # measured green on this runner; /usr/bin/time -l above reports the
          # peak RSS so the headroom is visible if it ever grows.
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # Skip the DMG that optimize-tauri-bundle.js packs at the end of the
          # build: the "Create DMG" step below builds it again from the signed
          # .app, so the one packed here is thrown away right after. Packing
          # costs 2-4 min (mount, lay out the .DS_Store, compress to UDZO) and
          # the job used to pay it twice.
          SKIP_DMG_BEAUTIFY: "true"
          # The cross target. `tauri build` gets it as --target (see
          # apps/web/scripts/tauri-build-region.mjs, which reads
          # ALLOOMI_TAURI_TARGET), and cargo gets it as CARGO_BUILD_TARGET so
          # the private meeting media worker is built for x86_64 as well --
          # that worker is a separate cargo project, so it does not inherit
          # the Tauri build's --target.
          #
          # Without the second one the meeting media runtime would be an
          # arm64 binary shipped inside an Intel app: it would load on an
          # Apple silicon Mac (which has Rosetta) and fail on every Intel
          # Mac, where the app is supposed to run.
          CARGO_BUILD_TARGET: x86_64-apple-darwin
          # The certificate itself is only handed to Tauri when the preflight
          # step found that the dedicated-keychain variant is the one that
          # signs on this machine; see the run block above.
          APPLE_CERTIFICATE_VALUE: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          APPLE_CERTIFICATE_PASSWORD_VALUE: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
          APPLE_SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          SKIP_SIGNING: 'false'

      - name: Verify the standalone bundle is not bloated
        # The .next/standalone tree is shipped verbatim inside the .app bundle
        # (see src-tauri/tauri.conf.json), so everything the file tracer drags
        # in is paid for twice: once in runner disk and once in the notarized
        # DMG.
        #
        # The file tracer can widen a path it resolved at runtime
        # (homedir(), process.cwd() + a dynamic suffix, ...): it records a bare
        # "<dynamic>" pattern, which expands to every file under the project
        # root -- src-tauri/target (~5 GB) and the test tree (~1 GB) included.
        # That is exactly what the Turbopack runs of 2026-10-21/22 traced
        # (2994 MB before the prune). outputFileTracingExcludes cannot help
        # either, because Next.js traces the instrumentation entry point with
        # page_name = None and only builds the exclude glob when a page name
        # exists. The alloomi repo prunes the over-traced paths afterwards, in
        # apps/web/scripts/fix-standalone-pnpm.js. This step is the guard that
        # the prune keeps working: without it the .app grows past 10 GB.
        working-directory: ./alloomi/apps/web
        run: |
          STANDALONE=.next/standalone
          test -d "$STANDALONE" || { echo "ERROR: $STANDALONE is missing"; exit 1; }
          for dir in apps/web/src-tauri apps/web/tests apps/web/cli-bundle/.claude; do
            if [ -d "$STANDALONE/$dir" ]; then
              echo "ERROR: the standalone bundle contains $dir/ -- the file tracer globbed the working directory"
              exit 1
            fi
          done
          # A stray .env in the bundle would ship the build machine's secrets.
          for env_file in "$STANDALONE"/apps/web/.env "$STANDALONE"/apps/web/.env.*; do
            if [ -f "$env_file" ]; then
              echo "ERROR: the standalone bundle contains $env_file"
              exit 1
            fi
          done
          # The monorepo root package.json decides the module type of every
          # .js file under skills/ that has no package.json of its own. Without
          # it those ESM scripts are parsed as CommonJS and die on their first
          # import statement.
          test -f "$STANDALONE/package.json" || {
            echo "ERROR: $STANDALONE/package.json is missing -- the bundled skill scripts would be parsed as CommonJS"
            exit 1
          }
          SIZE_KB=$(du -sk "$STANDALONE" | awk '{print $1}')
          echo "standalone size: $((SIZE_KB / 1024)) MB"
          if [ "$SIZE_KB" -gt 2097152 ]; then
            echo "ERROR: the standalone bundle is $((SIZE_KB / 1024)) MB, expected well under 2 GB"
            exit 1
          fi

      - name: Verify meeting media runtime is in the app bundle
        # Meeting recording runs through this helper; an app without it builds
        # fine but cannot record.
        if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
        run: |
          RUNTIME="$TAURI_BUNDLE_DIR/macos/Alloomi.app/Contents/Resources/resources/meeting-media"
          test -x "$RUNTIME/bin/alloomi-meeting-media" && test -f "$RUNTIME/manifest.json"
          codesign --verify --strict --verbose=2 "$RUNTIME/bin/alloomi-meeting-media"

      - name: Verify imessage-kit package files are in the standalone bundle
        # Regression guard for the v0.6.6 crash:
        # "Cannot find package '@photon-ai/imessage-kit/index.js'". The script
        # apps/web/scripts/fix-standalone-pnpm.js must land the package's
        # own files (package.json, dist/index.js, dist/index.cjs) into the
        # standalone tree -- otherwise Node falls back to index.js at the
        # package root and throws at runtime.
        working-directory: ./alloomi/apps/web
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = ".next/standalone/apps/web/node_modules/@photon-ai/imessage-kit";
            const missing = ["package.json", "dist/index.js", "dist/index.cjs"]
              .filter(rel => !fs.existsSync(path.join(root, rel)));
            if (missing.length) {
              console.error("ERROR: standalone is missing @photon-ai/imessage-kit files: " + missing.join(", "));
              console.error("       See apps/web/scripts/fix-standalone-pnpm.js -- copyIMessageKitPackage step");
              process.exit(1);
            }
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            if (!pkg.exports || !pkg.exports["."] || !pkg.exports["."].require) {
              console.error("ERROR: imessage-kit/package.json missing exports map; Node will fall back to index.js at root");
              process.exit(1);
            }
            console.log("OK: imessage-kit package files present in standalone bundle");
          '

      - name: Verify pdf.js runtime files are in the standalone bundle
        # Regression guard for the mailbox refresh hang: pdfjs-dist's legacy
        # build runs `new DOMMatrix()` at module top level and polyfills it by
        # require("@napi-rs/canvas"); the worker is loaded by dynamic path.
        # Next's file tracing copies neither, so the import rejects, officeparser's
        # fire-and-forget parsePdf() never invokes its callback, and
        # parseOfficeAsync() stays pending forever -- holding that bot's slot in
        # the serialized refresh queue until the app restarts. The script
        # apps/web/scripts/fix-standalone-pnpm.js must land both into the
        # standalone tree.
        working-directory: ./alloomi/apps/web
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const nm = ".next/standalone/node_modules";
            const missing = [
              "@napi-rs/canvas/package.json",
              "pdfjs-dist/legacy/build/pdf.worker.mjs",
            ].filter(rel => !fs.existsSync(path.join(nm, rel)));
            if (missing.length) {
              console.error("ERROR: standalone is missing pdf.js runtime files: " + missing.join(", "));
              console.error("       See apps/web/scripts/fix-standalone-pnpm.js -- copyPdfRuntime step");
              process.exit(1);
            }
            // Loading it proves the prebuilt binary matches this runner (a copy of
            // the wrong platform still resolves on disk but fails to dlopen).
            let DOMMatrix;
            try {
              ({ DOMMatrix } = require(path.resolve(nm, "@napi-rs/canvas")));
              new DOMMatrix();
            } catch (err) {
              console.error("ERROR: @napi-rs/canvas is present but will not load on this runner: " + err.message);
              console.error("       See apps/web/scripts/fix-standalone-pnpm.js -- copyPdfRuntime step");
              process.exit(1);
            }
            if (typeof DOMMatrix !== "function") {
              console.error("ERROR: @napi-rs/canvas exposes no DOMMatrix; pdf.js cannot load under Node");
              process.exit(1);
            }
            console.log("OK: pdf.js runtime (canvas polyfill + worker) present in standalone bundle");
          '

      - name: Verify finalized app signatures
        if: env.SKIP_SIGNING != 'true'
        run: |
          set -e
          APP_BUNDLE="$TAURI_BUNDLE_DIR/macos/Alloomi.app"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          echo "✅ App bundle signatures verified"

      - name: Create DMG (beautified, from signed app)
        env:
          # Build-step env is scoped per-step, so re-inject the identity used
          # to sign the DMG container itself.
          APPLE_SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
        run: |
          set -e

          APP_BUNDLE="$TAURI_BUNDLE_DIR/macos/Alloomi.app"
          DMG_DIR="$TAURI_BUNDLE_DIR/dmg"
          SRC_TAURI="./alloomi/apps/web/src-tauri"
          mkdir -p "$DMG_DIR"

          # optimize-tauri-bundle.js has already finalized $APP_BUNDLE using
          # Alloomi's inside-out signer. beautify-dmg.js only
          # `cp -R`s the .app into the DMG (never modifies its contents), so the
          # signature survives intact → notarization can cover the inner .app →
          # no more "已损坏，无法打开" on install. (Previously we copied the DMG
          # tauri:build emitted, whose inner .app was signed BEFORE the Developer
          # ID step, so the DMG shipped an unsigned ad-hoc .app.)
          echo "Verifying app signature before packing DMG..."
          codesign -dv "$APP_BUNDLE" 2>&1 | head -5

          # Drop any DMG tauri:build left behind so the glob below is unambiguous.
          rm -f "$DMG_DIR"/Alloomi*.dmg

          # Regenerate the beautified DMG against the SIGNED .app. The script
          # auto-discovers appPath + outDmg from target/release/bundle, reads the
          # version from tauri.conf.json, and emits Alloomi_<version>_x64.dmg.
          # Under CI (env CI=true) it uses the committed .DS_Store template
          # (resources/dmg_DS_Store) since the runner has no Finder/Aqua session.
          pushd "$SRC_TAURI" >/dev/null
          node scripts/beautify-dmg.js
          popd >/dev/null

          VERSION=$(node -p "require('./alloomi/apps/web/src-tauri/tauri.conf.json').version")
          BEAUTIFIED_DMG="$DMG_DIR/Alloomi_${VERSION}_x64.dmg"

          if [ ! -f "$BEAUTIFIED_DMG" ]; then
            echo "❌ Beautified DMG not found: $BEAUTIFIED_DMG"
            ls -la "$DMG_DIR" 2>/dev/null || true
            exit 1
          fi

          # Guard against beautify-dmg.js failing silently: a DMG with no
          # .background/ means the layout never landed.
          ATTACH=$(hdiutil attach -nobrowse -noverify "$BEAUTIFIED_DMG" | grep -o '/Volumes/Alloomi.*' | tail -1)
          if [ -z "$ATTACH" ] || [ ! -d "$ATTACH/.background" ]; then
            echo "❌ DMG has no .background/ — beautification did not run"
            [ -n "$ATTACH" ] && hdiutil detach "$ATTACH" -force
            exit 1
          fi
          hdiutil detach "$ATTACH" -force

          # Rename to the CI convention; downstream Notarize/Staple/Upload glob
          # Alloomi*.dmg, so we leave exactly ONE DMG in dmg/.
          COMMIT_SHA=$(cd alloomi && git rev-parse --short HEAD)
          DMG_PATH="$DMG_DIR/Alloomi_ci_${COMMIT_SHA}_x64.dmg"
          mv "$BEAUTIFIED_DMG" "$DMG_PATH"

          # Sign the DMG *container* itself. notarytool requires the submitted
          # DMG (not just the inner .app) to carry a Developer ID signature;
          # otherwise `xcrun notarytool submit` fails with
          # "code object is not signed at all". beautify-dmg.js only `hdiutil`s
          # the already-signed .app into the DMG and never signs the DMG, so we
          # add it here: Sign app → pack DMG → sign DMG → notarize → staple.
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign -dv "$DMG_PATH" 2>&1 | head -5

          echo "✅ Beautified DMG (from signed app) at: $DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Notarize DMG
        if: env.SKIP_SIGNING != 'true'
        timeout-minutes: 60
        run: |
          DMG_PATH=$(ls ./$TAURI_BUNDLE_DIR/dmg/Alloomi*.dmg)
          echo "Notarizing: $DMG_PATH"

          codesign -dv "$DMG_PATH" 2>&1 | head -5

          APPLE_ID="${{ secrets.ED_APPLE_ID }}"
          APPLE_PASSWORD="${{ secrets.ED_APPLE_PASSWORD }}"
          APPLE_TEAM_ID="${{ secrets.ED_APPLE_TEAM_ID }}"

          # `set -e` (default for GitHub Actions `run:` blocks) aborts the whole
          # script on a failing command substitution, so a failed `notarytool
          # submit` would exit BEFORE the `echo "$OUTPUT"` that prints its error
          # — leaving only "Signature size=9045" then "exit 1" in the log. Run
          # submit under `set +e` and capture output without aborting, so the
          # real notarytool error (auth failure, code rejection, etc.) always
          # surfaces.
          set +e
          OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          SUBMIT_EXIT=$?
          set -e

          echo "----- notarytool submit output (exit=$SUBMIT_EXIT) -----"
          echo "$OUTPUT"
          echo "--------------------------------------------------------"

          if [ "$SUBMIT_EXIT" -ne 0 ]; then
            echo "❌ notarytool submit failed (exit=$SUBMIT_EXIT). See output above."
            exit 1
          fi

          SUBMISSION_ID=$(echo "$OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "❌ notarytool submit returned no submission id. See output above."
            exit 1
          fi

          echo "Submission ID: $SUBMISSION_ID"

          echo "Waiting for notarization to complete..."
          set +e
          WAIT_OUTPUT=$(xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          WAIT_EXIT=$?
          set -e

          echo "----- notarytool wait output (exit=$WAIT_EXIT) -----"
          echo "$WAIT_OUTPUT"
          echo "--------------------------------------------------------"

          if echo "$WAIT_OUTPUT" | grep -q "status: Rejected"; then
            echo "❌ Notarization rejected. Fetching Apple's detailed log..."
            # The Apple-side log explains exactly why the DMG/.app was rejected
            # (e.g. "the binary is not signed", "code failed to satisfy
            # designated code requirement"). This is the decisive diagnostic.
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 || true
            exit 1
          elif echo "$WAIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "✅ Notarization accepted!"
          else
            echo "❌ Notarization status unclear (exit=$WAIT_EXIT). See output above."
            exit 1
          fi

          # No sleep here on purpose. Apple's ticket does not appear the
          # instant `notarytool wait` reports "Accepted": the submission has
          # to be published to the notary service first, which takes a while.
          # This step used to wait a flat 300 s for that, and the Staple DMG
          # step below already covers it properly -- it retries `stapler
          # staple` 20 times, 60 s apart, so it tolerates up to 20 minutes of
          # propagation delay. The 300 s sleep was pure waiting on top of a
          # retry loop that already waits for the same thing: on 2026-10-23
          # the sleep ended at 13:11:30 and the very first staple attempt
          # finished 0.4 s later, so the ticket had been ready for minutes.
          # Dropping the sleep takes 5 minutes off every signed build.

      - name: Staple DMG
        if: env.SKIP_SIGNING != 'true'
        continue-on-error: true
        run: |
          DMG_PATH=$(ls ./$TAURI_BUNDLE_DIR/dmg/Alloomi*.dmg)
          echo "Stapling: $DMG_PATH"

          STAPLED=false
          for i in $(seq 1 20); do
            echo "Staple attempt $i..."
            if xcrun stapler staple "$DMG_PATH" 2>&1; then
              echo "✅ Staple succeeded on attempt $i"
              STAPLED=true
              break
            else
              echo "Staple failed, waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          if [ "$STAPLED" = "true" ]; then
            if xcrun stapler validate "$DMG_PATH" 2>&1; then
              echo "✅ DMG stapled and validated successfully"
            else
              echo "❌ DMG stapled but validation failed"
              exit 1
            fi
          else
            echo "⚠️  Failed to staple DMG after 20 attempts"
          fi

      - name: Upload CI Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: alloomi-ci-dmg-x64${{ inputs.enable_outlook_china && '-outlook-china' || '' }}
          path: ${{ github.workspace }}/${{ env.TAURI_BUNDLE_DIR }}/dmg/Alloomi*.dmg

      - name: Drop the app bundle before the Rust cache is saved
        # Last step on purpose: the DMG is uploaded, so nothing else needs
        # the bundle. The post-job Swatinem/rust-cache save archives all of
        # target/, and leaving the .app and DMG in place is what made the
        # next run restore gigabytes of a stale artifact -- see "Drop the
        # previous run's app bundle from the Rust cache".
        run: rm -rf "$TAURI_BUNDLE_DIR"

  ci-alloomi-linux-amd64:
    if: ${{ !inputs.only_job || inputs.only_job == 'ci-alloomi-linux-amd64' }}
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout release repo
      uses: actions/checkout@v4

    - name: Clone alloomi source code (main branch)
      run: |
        git clone https://x-access-token:${{ secrets.DEPLOY_ACCESS_TOKEN }}@github.com/${{ env.ALLOOMI_REPO }}.git alloomi
        cd alloomi
        if [ "${{ github.event.inputs.commit_sha }}" != "" ]; then
          git checkout ${{ github.event.inputs.commit_sha }}
        else
          git checkout ${{ env.ALLOOMI_BRANCH }}
        fi
        echo "Commit: $(git log -1 --oneline)"

    - name: Stamp nightly version with build date
      id: nightly_version
      shell: bash
      run: bash scripts/bump-nightly-version.sh alloomi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.14.0

    - name: Add pnpm to PATH
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "PNPM_HOME=$HOME/.local" >> $GITHUB_ENV

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - name: Install Rust targets
      run: |
        rustup target add aarch64-unknown-linux-gnu
        rustup target add x86_64-unknown-linux-gnu

    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libxdo-dev \
          libxkbcommon-dev \
          libssl-dev \
          build-essential \
          libpipewire-0.3-dev \
          libasound2-dev

    - name: Install compatible SPA headers without upgrading Linux runtime
      run: |
        bash scripts/install-spa-headers.sh "$RUNNER_TEMP/spa-headers"
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/spa-headers/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

    - name: Get pnpm store directory
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      # v4, not v3: v3 is deprecated (it runs on a Node 16 runtime that
      # GitHub has retired) and it gzips the cache blob. The pnpm store is
      # 3.3 GB of small, highly compressible files, so the zstd compression
      # v4 uses makes the blob markedly smaller.
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alloomi/**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      working-directory: ./alloomi
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Copy docxodus WASM runtime
      working-directory: ./alloomi
      # --ignore-scripts skips apps/web's postinstall, which is the only
      # step that copies the docxodus .NET WASM runtime into public/.
      # Without it the packaged app's contract-review editor/compare
      # views fail at runtime ("Importing a module script failed").
      run: node apps/web/scripts/copy-docxodus-wasm.cjs

    - name: Link local @melandlabs/integrations facade
      working-directory: ./alloomi
      # apps/web's postinstall also copies the local 0.6.1 facade (which
      # has the composio/channels subpaths the build needs) into
      # node_modules. Without this step, .npmrc's node-linker=hoisted
      # grabs the npm 0.3.0 release instead and webpack fails with
      # "Can't resolve '@melandlabs/integrations/composio'" — see
      # PR #3380 and apps/web/scripts/pnpm-link-integrations-facade.cjs.
      run: node apps/web/scripts/pnpm-link-integrations-facade.cjs

    - name: Install better-sqlite3 prebuilt binary
      working-directory: ./alloomi
      run: |
        pnpm install -w better-sqlite3@12.11.1
        # The first install ran with --ignore-scripts, so the package's
        # install hook (`prebuild-install || node-gyp rebuild`) never ran
        # and the .node binary is missing. Force a rebuild so the hook
        # actually fires (pnpm otherwise sees the package as "already
        # installed" and skips it).
        pnpm rebuild better-sqlite3
        # Keep the nested slot under imessage-kit either absent or a real
        # package. A directory that holds only the native binary shadows
        # the complete root copy: Node's ESM resolver stops at the first
        # `better-sqlite3` directory it finds, so `import("better-sqlite3")`
        # inside imessage-kit rejects with ERR_MODULE_NOT_FOUND and the
        # packaged app reports "better-sqlite3 is required for Node.js
        # runtime" when it opens ~/Library/Messages/chat.db.
        nested=node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3
        if [ -d "$nested" ] && [ ! -f "$nested/package.json" ]; then
          echo "removing binary-only nested better-sqlite3 (it shadows the root copy)"
          rm -rf "$nested"
        fi
        if [ -f "$nested/package.json" ]; then
          mkdir -p "$nested/build/Release"
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
             "$nested/build/Release/better_sqlite3.node"
        fi

    - name: Verify native modules are Node v22 compatible
      working-directory: ./alloomi
      run: |
        set -e
        # Load both better-sqlite3 copies via direct file paths. The
        # nested @photon-ai/imessage-kit/node_modules/better-sqlite3 cannot
        # be required by its subpath because imessage-kit's `exports`
        # field does not expose it; we go around the resolver.
        node -e '
          const fs = require("fs");
          const path = require("path");
          const v = process.versions;
          console.log("node:", v.node, "abi:", v.modules);
          if (Number(v.modules) !== 127) {
            console.error("❌ unexpected NODE_MODULE_VERSION (expected 127 for Node 22)");
            process.exit(1);
          }
          // Top-level: what apps/web init-db.cjs requires
          const top = require("better-sqlite3");
          const topDb = new top(":memory:");
          topDb.pragma("user_version = 42");
          if (topDb.pragma("user_version", { simple: true }) !== 42) {
            throw new Error("top-level better-sqlite3 read-back failed");
          }
          topDb.close();
          console.log("✅ top-level better-sqlite3@" + require("better-sqlite3/package.json").version + " loadable on Node", v.node);
          // Nested: only present if pnpm resolved a different version for
          // @photon-ai/imessage-kit. With the root pinned to 12.11.1, the
          // shared version is hoisted and the nested copy disappears.
          const nestedPkgPath = path.join(process.cwd(), "node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3");
          if (fs.existsSync(path.join(nestedPkgPath, "package.json"))) {
            const nested = require(nestedPkgPath);
            const nestedDb = new nested(":memory:");
            nestedDb.pragma("user_version = 7");
            if (nestedDb.pragma("user_version", { simple: true }) !== 7) {
              throw new Error("nested better-sqlite3 read-back failed");
            }
            nestedDb.close();
            console.log("✅ imessage-kit better-sqlite3@" + require(path.join(nestedPkgPath, "package.json")).version + " loadable on Node", v.node);
          } else {
            console.log("ℹ️ imessage-kit nested better-sqlite3 not present (sharing root copy at v" + require("better-sqlite3/package.json").version + ")");
          }
        '

    - name: Create .env file
      working-directory: ./alloomi/apps/web
      run: |
        cat > .env << 'EOF'

        CLOUD_API_URL=https://app.alloomi.ai
        NEXT_PUBLIC_CLOUD_API_URL=https://app.alloomi.ai
        NEXT_PUBLIC_APP_URL=http://localhost:3415

        LLM_BASE_URL=https://openrouter.ai/api/v1
        LLM_MODEL=google/gemini-3-flash-preview
        LLM_REASONING_MODEL=google/gemini-3-flash-preview
        LLM_VISION_LANGUAGE_MODEL=google/gemini-3-flash-preview
        LLM_IMAGE_MODEL=openai/gpt-5-image

        LLM_EMBEDDING_MODEL=qwen/qwen3-embedding-4b
        LLM_EMBEDDING_BASE_URL=https://openrouter.ai/api/v1

        TELEGRAM_MODE=pooling

        ANTHROPIC_BASE_URL=http://localhost:3415/api/ai
        API_TIMEOUT_MS=3000000
        IS_TAURI=true

        EOF

    - name: Enable Outlook (21Vianet) connector
      # Manual-dispatch customer variant only. The flag is read from the .env
      # that ships inside the bundle, so it must live in the file, not just in
      # the build process environment.
      if: inputs.enable_outlook_china
      working-directory: ./alloomi/apps/web
      run: echo "NEXT_PUBLIC_ENABLE_OUTLOOK_CHINA=1" >> .env

    - name: Patch tauri.conf.* to skip AppImage on Linux
      working-directory: ./alloomi/apps/web
      run: |
        node -e "
          const fs = require('fs');
          // 'pnpm tauri:build' reads the regional config picked by ALLOOMI_REGION
          // (default: intl → tauri.conf.intl.json). Patching only tauri.conf.json
          // never reached the active config, so AppImage bundling kept running and
          // 'linuxdeploy' failed silently on both amd64 and arm64 runners. Loop
          // over every regional config so the patch covers whichever one the
          // build actually loads.
          const paths = [
            'src-tauri/tauri.conf.json',
            'src-tauri/tauri.conf.intl.json',
            'src-tauri/tauri.conf.cn.json',
            'src-tauri/tauri.conf.dev.json',
          ];
          for (const path of paths) {
            const c = JSON.parse(fs.readFileSync(path, 'utf8'));
            c.bundle.targets = ['deb'];
            fs.writeFileSync(path, JSON.stringify(c, null, 2));
            console.log('Patched ' + path + ' targets to deb');
          }
        "

    - name: Cache Rust build (cargo registry + target)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ./alloomi/apps/web/src-tauri -> target
        prefix-key: ${{ runner.os }}-${{ runner.arch }}
        if-no-files-found: warn

    # GitHub-hosted ubuntu-22.04 runners ship 16 GB RAM and only ~3 GB swap.
    # The web/tauri build runs `next build --webpack` (V8 heap) alongside
    # `cargo` (Rust) and native deps (better-sqlite3, sqlite-vec), and the peak
    # pushes the VM past its memory budget, at which point the runner is
    # SIGTERMed mid-build. Growing swap to 8 GB gives the build headroom.
    #
    # The runner image ALREADY ships a /swapfile, so the previous
    # `if [ ! -f /swapfile ]` guard skipped every branch and the 8 GB never
    # materialised (free -h kept reporting Swap: 3.0Gi). Always rebuild the
    # file instead of only creating it when absent.
    - name: Configure swap (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo swapoff /swapfile 2>/dev/null || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install meeting media SDK build dependencies
      if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
      run: sudo apt-get install -y flex bison libglib2.0-dev libpulse-dev python3-venv

    - name: Restore meeting media SDK cache
      # Ubuntu 22.04 ships GStreamer 1.20; the media runtime needs >= 1.22, so
      # the SDK is compiled from pinned sources. The script only reuses a cached
      # SDK whose stamp matches the script that built it.
      id: meeting-media-cache
      if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
      uses: actions/cache/restore@v4
      with:
        path: |
          alloomi/.local-dev/gstreamer/downloads
          alloomi/.local-dev/gstreamer/sdk
        key: gstreamer-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('alloomi/scripts/meeting-media-probe/prepare-linux-sdk.sh') }}

    - name: Prepare meeting media GStreamer SDK
      if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
      working-directory: ./alloomi
      run: bash scripts/meeting-media-probe/prepare-linux-sdk.sh

    - name: Save meeting media SDK cache
      # Saved right after preparing so a later build failure keeps it.
      if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != '' && steps.meeting-media-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          alloomi/.local-dev/gstreamer/downloads
          alloomi/.local-dev/gstreamer/sdk
        key: ${{ steps.meeting-media-cache.outputs.cache-primary-key }}

    - name: Build Tauri app (Linux)
      working-directory: ./alloomi/apps/web
      run: pnpm tauri:build
      env:
        SKIP_TYPE_CHECK: "true" # see ci-alloomi-macos-arm64
        # No ALLOOMI_WEBPACK_FS_CACHE here: webpack's persistent cache only
        # pays off when the same checkout is built twice, and a CI job starts
        # from a fresh clone, so the multi-GB serialize + write buys nothing.
        # See the cache block in melandlabs/alloomi's apps/web/next.config.js.

    - name: Verify meeting media runtime is in the deb
      # Meeting recording runs through this helper; a package without it
      # installs fine but cannot record.
      if: hashFiles('alloomi/apps/web/scripts/build-meeting-media.mjs') != ''
      run: |
        DEB=$(ls ./alloomi/apps/web/src-tauri/target/release/bundle/deb/*.deb)
        dpkg -c "$DEB" | grep -q 'meeting-media/bin/alloomi-meeting-media$'
