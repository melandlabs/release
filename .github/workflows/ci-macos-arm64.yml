name: CI Alloomi (macOS arm64 only)

# Runs exactly one job of the release CI -- the Apple silicon build on the
# self-hosted EC2 Mac -- and nothing else. The main workflow normally runs
# from a workflow_dispatch event; this wrapper triggers it from a push, so
# the single job can be exercised without dispatching the whole matrix.
#
# Every push to the branch below starts a fresh run. Delete this file once
# the arm64 runner is settled.

on:
  push:
    branches:
      - feat/macos-ec2-arm64-runner
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific alloomi commit SHA to build (optional)'
        required: false
        type: string
        default: ''
      enable_outlook_china:
        description: 'Build the Outlook (21Vianet) customer variant'
        required: false
        type: boolean
        default: false

jobs:
  ci-alloomi-macos-arm64:
    uses: melandlabs/release/.github/workflows/ci.yml@feat/macos-ec2-arm64-runner
    with:
      only_job: ci-alloomi-macos-arm64
      # Pinned to the commit that prepares the GStreamer SDK on the EC2 Mac
      # (melandlabs/alloomi PR #4045). It is not on main yet, so without it
      # the build hangs on the SDK download; drop the pin once it merges.
      commit_sha: ${{ inputs.commit_sha || '7cc2d06d1ad067c0f9f34990c1a5436bd0c402c8' }}
      enable_outlook_china: ${{ inputs.enable_outlook_china }}
    secrets: inherit
